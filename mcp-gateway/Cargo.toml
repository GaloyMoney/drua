[package]
name = "drua-mcp-gateway"
version.workspace = true
edition.workspace = true

[lib]

[dependencies]
drua-core = { path = "../core" }
es-entity = { workspace = true }
axum = { workspace = true }
http = "1"
rmcp = { version = "1.2", features = ["server", "transport-streamable-http-server", "macros"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
