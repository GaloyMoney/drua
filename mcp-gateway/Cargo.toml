[package]
name = "galoy-agents-mcp-gateway"
version.workspace = true
edition.workspace = true

[lib]

[dependencies]
concourse-client = { workspace = true }
galoy-agents-core = { path = "../core" }
code-assistant-server = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
http = "1"
rmcp = { version = "1.2", features = ["server", "transport-streamable-http-server", "macros"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
