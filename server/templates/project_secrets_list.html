{% if secrets.is_empty() %}
<p><em>No secrets configured.</em></p>
{% else %}
<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Type</th>
      <th>Updated</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for secret in secrets %}
    <tr>
      <td><code>{{ secret.name }}</code></td>
      <td>{{ secret.secret_type }}</td>
      <td><small>{{ secret.updated_at }}</small></td>
      <td>
        <button
          data-gql-mutation="mutation($input: ProjectSecretDeleteInput!) { projectSecretDelete(input: $input) { deletedId } }"
          data-gql-input='{"id":"{{ secret.id }}"}'
          data-gql-confirm="Delete secret '{{ secret.name }}'?"
          data-gql-target="#secrets-list"
          data-gql-refresh-url="/projects/{{ secret.project_id }}/secrets/list"
          class="outline secondary"
          style="padding: 0.25rem 0.5rem; margin: 0;"
        >Delete</button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endif %}
