{% extends "base.html" %}

{% block title %}Audit Log — Drua{% endblock %}

{% block nav_audit %}class="active"{% endblock %}

{% block head %}
<style>
  .subject-cell { white-space: nowrap; }
  .subject-owner { font-size: 0.8em; opacity: 0.7; }
  .outcome-success { color: #388e3c; font-weight: bold; }
  .outcome-error { color: #d32f2f; font-weight: bold; }
  .outcome-unauthorized { color: #f57c00; font-weight: bold; }
</style>
{% endblock %}

{% block content %}
<h2>Audit Log</h2>

<div id="audit-entries"
     hx-get="/audit/entries" hx-trigger="load" hx-swap="innerHTML">
  <p aria-busy="true">Loading...</p>
</div>
{% endblock %}
