{% extends "base.html" %}

{% block title %}Dashboard — Galoy Agents{% endblock %}

{% block nav_dashboard %}class="active"{% endblock %}

{% block content %}
<p>Welcome, {{ user_name }}</p>

<section>
  <h2>Create MCP Credentials</h2>
  <form hx-post="/mcp-creds/create" hx-target="#creds-result" hx-swap="innerHTML">
    <label>
      Name
      <input type="text" name="name" required placeholder="my-creds">
    </label>
    <label>
      <input type="checkbox" name="admin" value="true">
      Admin scope (grants access to workspace &amp; agent management tools)
    </label>
    <button type="submit">Create Credentials</button>
  </form>
  <div id="creds-result"></div>
</section>

<section>
  <h2>Your MCP Credentials</h2>
  <figure>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Created</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="creds-list">
        {% for creds in mcp_creds %}
        {% include "mcp_creds_row.html" %}
        {% endfor %}
      </tbody>
    </table>
  </figure>
</section>
{% endblock %}
