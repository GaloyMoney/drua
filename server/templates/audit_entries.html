<figure>
  <table>
    <thead>
      <tr>
        <th>Actor</th>
        <th>Entrypoint</th>
        <th>Action</th>
        <th>Outcome</th>
        <th>Duration</th>
        <th>Tokens</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody>
      {% for entry in entries %}
      <tr>
        <td class="subject-cell">{% match entry.acting_agent %}{% when Some with (agent) %}<strong>{{ agent }}</strong>{% when None %}{% endmatch %}{% match entry.acting_user %}{% when Some with (user) %}<strong>{{ user }}</strong>{% when None %}{% endmatch %}{% match entry.project %}{% when Some with (project) %}<br><span class="subject-owner">project: {{ project }}</span>{% when None %}{% endmatch %}{% match entry.on_behalf_of %}{% when Some with (obo) %}<br><span class="subject-owner">↳ on behalf of {{ obo }}</span>{% when None %}{% endmatch %}</td>
        <td>{% match entry.entrypoint %}{% when Some with (ep) %}{{ ep }}{% when None %}—{% endmatch %}</td>
        <td>{{ entry.action }}</td>
        <td><span class="outcome-{{ entry.outcome }}">{{ entry.outcome }}</span></td>
        <td>{% match entry.duration_ms %}{% when Some with (ms) %}{{ ms }}ms{% when None %}—{% endmatch %}</td>
        <td>{% match entry.tokens_returned %}{% when Some with (t) %}{{ t }}{% when None %}—{% endmatch %}</td>
        <td>{{ entry.recorded_at.format("%Y-%m-%d %H:%M:%S UTC") }}</td>
      </tr>
      {% if entry.metadata != serde_json::Value::Object(Default::default()) %}
      <tr>
        <td colspan="7" style="padding: 0;">
          <details>
            <summary style="padding: 0.25rem 0.5rem; font-size: 0.8rem; cursor: pointer;">Show metadata</summary>
            <pre style="font-size: 0.75rem; max-height: 300px; overflow: auto; margin: 0; padding: 0.5rem;">{{ entry.metadata }}</pre>
          </details>
        </td>
      </tr>
      {% endif %}
      {% endfor %}
      {% if entries.is_empty() %}
      <tr><td colspan="7">No audit entries found.</td></tr>
      {% endif %}
    </tbody>
  </table>
</figure>
