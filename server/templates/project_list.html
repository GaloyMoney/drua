{% if projects.is_empty() %}
<p>No projects yet. Create one to get started.</p>
{% else %}
<figure>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Created</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for project in projects %}
      <tr>
        <td><strong>{{ project.name }}</strong></td>
        <td>{{ project.description }}</td>
        <td>{{ project.created_at }}</td>
        <td style="display: flex; gap: 0.5rem;">
          <a href="/projects/{{ project.id }}/chat">Chat</a>
          <a href="/projects/{{ project.id }}">Edit</a>
          <button
            data-gql-mutation="mutation($input: ProjectDeleteInput!) { projectDelete(input: $input) { project { id } } }"
            data-gql-input='{"id":"{{ project.id }}"}'
            data-gql-confirm="Are you sure you want to delete this project?"
            data-gql-reload="true"
            class="secondary outline"
            style="padding: 0.25rem 0.5rem; margin: 0; font-size: 0.85em;"
          >
            Delete
          </button>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</figure>
{% endif %}
