{% extends "base.html" %}

{% block title %}Chat — {{ workspace.name }} — Galoy Agents{% endblock %}

{% block nav_workspaces %}class="active"{% endblock %}

{% block head %}
<style>
  .chat-layout { display: flex; height: calc(100vh - 6rem); gap: 1rem; }
  .chat-main { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .chat-header { margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; }
  .chat-header a { font-size: 0.85rem; }
  .chat-header-left { display: flex; flex-direction: column; }
  .config-toggle {
    background: none; border: 1px solid var(--pico-muted-border-color);
    border-radius: var(--pico-border-radius); padding: 0.4rem 0.6rem;
    cursor: pointer; font-size: 1.1rem; width: auto; margin: 0; line-height: 1;
  }
  .config-toggle:hover { background: var(--pico-primary-background); color: var(--pico-primary-inverse); }
  .config-toggle.active { background: var(--pico-primary-background); color: var(--pico-primary-inverse); }
  .config-sidebar {
    width: 280px; flex-shrink: 0;
    border: 1px solid var(--pico-muted-border-color);
    border-radius: var(--pico-border-radius);
    padding: 1rem; overflow-y: auto;
    display: none;
  }
  .config-sidebar.open { display: block; }
  .config-sidebar h4 { margin-top: 0; margin-bottom: 0.75rem; font-size: 0.95rem; }
  .config-sidebar label { font-size: 0.85rem; margin-bottom: 0.25rem; }
  .config-sidebar input, .config-sidebar select { font-size: 0.85rem; padding: 0.35rem 0.5rem; }
  .config-sidebar button { font-size: 0.85rem; padding: 0.4rem 0.75rem; }
  .messages {
    flex: 1;
    overflow-y: auto;
    border: 1px solid var(--pico-muted-border-color);
    border-radius: var(--pico-border-radius);
    padding: 1rem;
    margin-bottom: 1rem;
    font-family: monospace;
    font-size: 0.85rem;
    background: var(--pico-code-background-color);
  }
  .messages .msg { margin-bottom: 0.5rem; white-space: pre-wrap; word-break: break-word; }
  .messages .msg-system { color: var(--pico-muted-color); }
  .messages .msg-assistant { color: var(--pico-color); }
  .messages .msg-error { color: var(--pico-del-color); }
  .messages .msg-result { color: var(--pico-ins-color); }
  .chat-input { display: flex; gap: 0.5rem; }
  .chat-input textarea { flex: 1; resize: none; }
  .chat-input button { width: auto; align-self: end; }
</style>
{% endblock %}

{% block content %}
<div class="chat-layout">
  <div class="chat-main">
    <div class="chat-header">
      <div class="chat-header-left">
        <a href="/workspaces">&larr; {{ workspace.name }}</a>
        <h2>Workspace Lead</h2>
      </div>
      <button class="config-toggle" id="config-toggle-btn" onclick="toggleConfig()" title="Agent config">&#9881;</button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="chat-input">
      <textarea id="prompt" rows="3" placeholder="Type a message..."></textarea>
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

</div>

<script>
const agentId = '{{ agent_id }}';
let sessionId = null;

function toggleConfig() {
  const sidebar = document.getElementById('config-sidebar');
  const btn = document.getElementById('config-toggle-btn');
  sidebar.classList.toggle('open');
  btn.classList.toggle('active');
}

function appendMsg(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  const container = document.getElementById('messages');
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
}

function appendOrStream(cls, text) {
  const container = document.getElementById('messages');
  const last = container.lastElementChild;
  if (last && last.classList.contains(cls) && last.dataset.streaming === '1') {
    last.textContent += text;
  } else {
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.dataset.streaming = '1';
    el.textContent = text;
    container.appendChild(el);
  }
  container.scrollTop = container.scrollHeight;
}

const AGENT_MESSAGE_SUBSCRIPTION = `subscription ($agentId: AgentId!, $prompt: String!) {
  agentSendMessage(agentId: $agentId, prompt: $prompt) {
    __typename
    ... on AssistantTextDeltaEvent { text }
    ... on ThinkingDeltaEvent { text }
    ... on ToolCallStartEvent { name }
    ... on ToolCallInputDeltaEvent { partialJson }
    ... on AssistantTextEvent { text }
    ... on ThinkingEvent { text }
    ... on UserMessageEvent { text }
    ... on ToolResultEvent { name isError content }
    ... on AssistantDoneEvent { turns inputTokens outputTokens durationMs costUsd }
    ... on ErrorEvent { message }
    ... on ServiceEvent { message }
  }
}`;

function handleStreamEvent(event) {
  const t = event.__typename;
  if (t === 'AssistantTextDeltaEvent') {
    appendOrStream('msg-assistant', event.text);
  } else if (t === 'ThinkingDeltaEvent') {
    appendOrStream('msg-system', event.text);
  } else if (t === 'ToolCallStartEvent') {
    appendMsg('msg-system', 'Calling tool: ' + event.name + '...');
  } else if (t === 'ToolCallInputDeltaEvent') {
    // partial JSON — ignore in UI
  } else if (t === 'AssistantTextEvent') {
    appendMsg('msg-assistant', event.text);
  } else if (t === 'ThinkingEvent') {
    appendMsg('msg-system', '(thinking) ' + event.text);
  } else if (t === 'UserMessageEvent') {
    // Already rendered locally when the user hit Send; skip the echo.
  } else if (t === 'ToolResultEvent') {
    appendMsg('msg-system', (event.isError ? 'error: ' : 'ok: ') + event.name);
  } else if (t === 'AssistantDoneEvent') {
    const tokens = (event.inputTokens || 0) + (event.outputTokens || 0);
    const parts = [(event.turns || 0) + ' turns', tokens + ' tokens'];
    if (event.durationMs) parts.push((event.durationMs / 1000).toFixed(1) + 's');
    if (event.costUsd) parts.push('$' + event.costUsd.toFixed(4));
    appendMsg('msg-result', 'Done — ' + parts.join(', '));
  } else if (t === 'ErrorEvent') {
    appendMsg('msg-error', event.message || JSON.stringify(event));
  } else if (t === 'ServiceEvent') {
    appendMsg('msg-system', event.message);
  }
}

async function sendMessage() {
  const textarea = document.getElementById('prompt');
  const prompt = textarea.value.trim();
  if (!prompt) return;

  textarea.value = '';
  document.getElementById('send-btn').disabled = true;
  appendMsg('msg-system', '> ' + prompt);

  try {
    const resp = await fetch('/graphql/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query: AGENT_MESSAGE_SUBSCRIPTION,
        variables: { agentId: agentId, prompt: prompt }
      }),
    });

    if (!resp.ok) {
      appendMsg('msg-error', 'Error: ' + resp.status);
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      let eventType = '';
      for (const line of lines) {
        if (line.startsWith('event:')) {
          eventType = line.slice(6).trim();
        } else if (line.startsWith('data:')) {
          const data = line.slice(5).trim();
          if (eventType === 'complete' || !data) continue;
          try {
            const gqlResp = JSON.parse(data);
            if (gqlResp.errors && gqlResp.errors.length) {
              appendMsg('msg-error', gqlResp.errors[0].message);
            } else if (gqlResp.data && gqlResp.data.agentSendMessage) {
              handleStreamEvent(gqlResp.data.agentSendMessage);
            }
          } catch { /* ignore parse errors */ }
        }
      }
    }
  } catch (e) {
    appendMsg('msg-error', 'Network error: ' + e.message);
  } finally {
    document.getElementById('send-btn').disabled = false;
    textarea.focus();
  }
}

document.getElementById('prompt').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>
{% endblock %}
