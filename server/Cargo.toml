[package]
name = "drua-server"
version.workspace = true
edition.workspace = true

[lib]

[[bin]]
name = "write_sdl"
path = "src/bin/write_sdl.rs"

[dependencies]
drua-core = { path = "../core", features = ["graphql"] }
drua-mcp-gateway = { path = "../mcp-gateway" }
sandbox = { workspace = true }
es-entity = { workspace = true }
anyhow = "1"
askama = "0.15"
askama_web = { version = "0.15", features = ["axum-0.8"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
async-graphql = { version = "8.0.0-rc.4", default-features = false, features = ["tracing", "tempfile"] }
async-graphql-axum = "8.0.0-rc.4"
k8s-openapi = { version = "0.25", features = ["v1_33"] }
kube = { version = "1", features = ["client"] }
oauth2 = { version = "5.0", features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate"] }
thiserror = "2.0"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
tower-service = "0.3"
tower-sessions = "0.15"
tracing = "0.1"
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-http = "0.31"
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
url = { workspace = true }
uuid = { version = "1", features = ["v4"] }
