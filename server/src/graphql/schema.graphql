type Agent {
	attachedSandbox: SandboxAttachment
	id: AgentId!
	name: String!
	projectId: ProjectId!
	role: AgentRole!
	session: AgentSession!
}

input AgentAttachSandboxInput {
	agentId: AgentId!
	mode: SandboxAttachmentMode!
	sandboxId: SandboxId!
}

type AgentAttachSandboxPayload {
	agent: Agent!
}

input AgentCreateInput {
	name: String!
	projectId: ProjectId!
	sandboxId: SandboxId
	sandboxMode: SandboxAttachmentMode
}

type AgentCreatePayload {
	agent: Agent!
}

input AgentDeleteInput {
	id: AgentId!
}

type AgentDeletePayload {
	deletedId: AgentId!
}

input AgentDetachSandboxInput {
	agentId: AgentId!
	sandboxId: SandboxId!
}

type AgentDetachSandboxPayload {
	agent: Agent!
}

scalar AgentId

enum AgentRole {
	AGENT
	PROJECT_LEAD
}

type AgentSession {
	"""
	Flat chat history: recent user messages and assistant responses.
	Returns the last `last` messages in chronological order.
	"""
	chatHistory(last: Int! = 20): [ChatMessage!]!
	"""
	Model used by the LLM for this session's prompts.
	"""
	model: String!
	"""
	Session-wide list of every system block ever pushed for this agent,
	ordered by `SystemBlockIndex`. Available before the first prompt
	(when no thread exists yet) — useful for inspecting initial context
	without firing an LLM round trip. Resolved directly off the loaded
	entity; auth was applied by the parent `Query.agent(id)` resolver.
	"""
	systemBlocks: [SystemBlockInfo!]!
	"""
	All threads in this session.
	"""
	threads: [SessionThread!]!
}

type AssistantDoneEvent {
	costUsd: Float
	durationMs: Int
	inputTokens: Int!
	outputTokens: Int!
	turns: Int!
}

type AssistantTextDeltaEvent {
	text: String!
}

type AssistantTextEvent {
	text: String!
}

type AuditEntry {
	actingAgentId: UUID
	actingUserId: UUID
	action: String!
	durationMs: Int
	entrypoint: String
	error: Boolean
	interactionType: String!
	onBehalfOfUserId: UUID
	outcome: String!
	recordedAt: Timestamp!
	tokensReturned: Int
}

input AuditLogQueryInput {
	actingAgentId: AgentId
	action: String
	error: Boolean
	limit: Int! = 20
	outcome: String
	projectId: ProjectId
}

union ChatContentBlock = TextContent | ToolUseContent | ThinkingContent | ToolResultContent | SandboxNotificationContent

type ChatMessage {
	content: [ChatContentBlock!]!
	role: ChatMessageRole!
	"""
	Ordinal position in the full message history (0-based).
	"""
	sequence: Int!
}

enum ChatMessageRole {
	ASSISTANT
	USER
}

union ChatStreamEvent = UserMessageEvent | AssistantTextEvent | ThinkingEvent | AssistantTextDeltaEvent | ThinkingDeltaEvent | ToolCallStartEvent | ToolCallInputDeltaEvent | ToolResultEvent | AssistantDoneEvent | ErrorEvent | ServiceEvent

type ErrorEvent {
	message: String!
}

"""
Workflow files are git-synced to the library repo but not exposed
here — `AuthedSearch::search` filters them out at the boundary.
"""
enum LibraryFileType {
	NOTE
	SKILL
	SPACE_FILE
}

type LibrarySearchHit {
	id: UUID!
	"""
	`null` for global content (skills with no project) and for
	space files (which are scoped to a `space_slug` instead).
	"""
	projectId: ProjectId
	"""
	Set on `SpaceFile` hits: the file's path inside `spaces/<slug>/`.
	"""
	relativePath: String
	score: Float!
	snippet: String!
	"""
	Set on `SpaceFile` hits. Use this — not `project_id` — to
	label the result's scope in UIs.
	"""
	spaceSlug: String
	tags: [String!]!
	title: String!
	type: LibraryFileType!
}

input LibrarySearchInput {
	limit: Int! = 50
	"""
	Omitted = all projects the subject can read.
	"""
	projectId: ProjectId
	query: String!
	"""
	Empty / omitted = all types.
	"""
	types: [LibraryFileType!]
}

input McpCredentialsCreateInput {
	name: String!
	"""
	The scopes to grant, as strings (e.g. "admin", "project_admin:<id>").
	"""
	scopes: [String!]!
}

"""
Returned on create — includes the plaintext token (shown only once).
"""
type McpCredentialsCreatePayload {
	mcpCreds: McpCreds!
	"""
	The plaintext token. Only returned once on creation.
	"""
	token: String!
}

input McpCredentialsRevokeInput {
	id: McpCredsId!
}

type McpCredentialsRevokePayload {
	mcpCreds: McpCreds!
}

type McpCreds {
	createdAt: Timestamp!
	id: McpCredsId!
	name: String!
	revoked: Boolean!
	revokedAt: Timestamp
}

scalar McpCredsId

type Me {
	email: String
	githubUsername: String
	id: UUID!
	name: String
}

type Mutation {
	agentAttachSandbox(input: AgentAttachSandboxInput!): AgentAttachSandboxPayload!
	agentCreate(input: AgentCreateInput!): AgentCreatePayload!
	agentDelete(input: AgentDeleteInput!): AgentDeletePayload!
	agentDetachSandbox(input: AgentDetachSandboxInput!): AgentDetachSandboxPayload!
	mcpCredentialsCreate(input: McpCredentialsCreateInput!): McpCredentialsCreatePayload!
	mcpCredentialsRevoke(input: McpCredentialsRevokeInput!): McpCredentialsRevokePayload!
	noteDelete(input: NoteDeleteInput!): NoteDeletePayload!
	ping: String!
	projectCreate(input: ProjectCreateInput!): ProjectCreatePayload!
	projectDelete(input: ProjectDeleteInput!): ProjectDeletePayload!
	projectSecretCreate(input: ProjectSecretCreateInput!): ProjectSecretCreatePayload!
	projectSecretDelete(input: ProjectSecretDeleteInput!): ProjectSecretDeletePayload!
	projectUpdate(input: ProjectUpdateInput!): ProjectUpdatePayload!
	sandboxCreate(input: SandboxCreateInput!): SandboxCreatePayload!
	sandboxRestart(input: SandboxRestartInput!): SandboxRestartPayload!
	sandboxSuspend(input: SandboxSuspendInput!): SandboxSuspendPayload!
	skillDelete(input: SkillDeleteInput!): SkillDeletePayload!
}

input NoteDeleteInput {
	id: NoteId!
	projectId: ProjectId!
}

type NoteDeletePayload {
	deletedId: NoteId!
}

scalar NoteId

"""
Information about pagination in a connection
"""
type PageInfo {
	"""
	When paginating forwards, the cursor to continue.
	"""
	endCursor: String
	"""
	When paginating forwards, are there more items?
	"""
	hasNextPage: Boolean!
	"""
	When paginating backwards, are there more items?
	"""
	hasPreviousPage: Boolean!
	"""
	When paginating backwards, the cursor to continue.
	"""
	startCursor: String
}

type Project {
	"""
	Lead agent first.
	"""
	agents: [Agent!]!
	createdAt: Timestamp!
	description: String
	id: ProjectId!
	lead: Agent!
	mcpCredentials: [McpCreds!]!
	name: String!
	sandboxes: [Sandbox!]!
	"""
	Metadata only — values are never exposed via GraphQL.
	"""
	secrets: [ProjectSecret!]!
	skills: [Skill!]!
}

type ProjectConnection {
	"""
	A list of edges.
	"""
	edges: [ProjectEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Project!]!
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
}

input ProjectCreateInput {
	description: String
	name: String!
}

type ProjectCreatePayload {
	project: Project!
}

input ProjectDeleteInput {
	id: ProjectId!
}

type ProjectDeletePayload {
	project: Project!
}

"""
An edge in a connection.
"""
type ProjectEdge {
	"""
	A cursor for use in pagination
	"""
	cursor: String!
	"""
	The item at the end of the edge
	"""
	node: Project!
}

scalar ProjectId

type ProjectSecret {
	createdAt: Timestamp!
	id: ProjectSecretId!
	name: String!
	projectId: ProjectId!
	secretType: SecretTypeEnum!
}

input ProjectSecretCreateInput {
	name: String!
	projectId: ProjectId!
	secretType: SecretTypeEnum!
	value: String!
}

type ProjectSecretCreatePayload {
	projectSecret: ProjectSecret!
}

input ProjectSecretDeleteInput {
	id: ProjectSecretId!
}

type ProjectSecretDeletePayload {
	deletedId: ProjectSecretId!
}

scalar ProjectSecretId

input ProjectUpdateInput {
	description: String
	id: ProjectId!
}

type ProjectUpdatePayload {
	project: Project!
}

type Query {
	agent(id: AgentId!): Agent
	appConfig: Yaml!
	auditLog(input: AuditLogQueryInput!): [AuditEntry!]!
	"""
	Pi-compatible JSONL (v3). When `thread_id` is omitted the current
	main thread is exported.
	"""
	exportThread(agentId: AgentId!, threadId: SessionThreadId): String!
	"""
	Cross-type, cross-project library search. Open to any
	authenticated subject; library content is globally discoverable.
	`projectId` is optional — when set the project is validated
	via `find_by_id`; when omitted no project filter is applied.
	"""
	librarySearch(input: LibrarySearchInput!): [LibrarySearchHit!]!
	me: Me
	ping: String!
	project(id: ProjectId!): Project
	projects(after: String, first: Int!): ProjectConnection!
	sandbox(id: SandboxId!): Sandbox
}

type Sandbox {
	attachedAgents: [SandboxAgentAttachment!]!
	cpu: String!
	createdAt: Timestamp!
	diskSize: String!
	id: SandboxId!
	lastError: String
	memory: String!
	mountPath: String!
	name: String!
	projectId: ProjectId!
	state: SandboxStateEnum!
}

type SandboxAgentAttachment {
	agentId: AgentId!
	mode: SandboxAttachmentMode!
}

type SandboxAttachment {
	mode: SandboxAttachmentMode!
	name: String!
	sandboxId: SandboxId!
}

enum SandboxAttachmentMode {
	READ
	WRITE
}

input SandboxCreateInput {
	branch: String
	cpu: String! = "500m"
	diskSize: String! = "10Gi"
	memory: String! = "512Mi"
	mode: SandboxCreateMode!
	name: String!
	projectId: ProjectId!
	repoUrl: String
}

enum SandboxCreateMode {
	REPO
	SCRATCH
}

type SandboxCreatePayload {
	sandbox: Sandbox!
}

scalar SandboxId

type SandboxNotificationContent {
	mode: String
	operation: SandboxNotificationOperation!
	sandboxName: String!
	"""
	The rendered notification text that was injected into the prompt.
	"""
	text: String!
}

enum SandboxNotificationOperation {
	ATTACH
	DETACH
}

input SandboxRestartInput {
	id: SandboxId!
}

type SandboxRestartPayload {
	sandbox: Sandbox!
}

enum SandboxStateEnum {
	ERRORED
	INITIALIZING
	PROVISIONING
	READY
	SUSPENDED
}

input SandboxSuspendInput {
	id: SandboxId!
}

type SandboxSuspendPayload {
	sandbox: Sandbox!
}

enum SecretTypeEnum {
	ENV_VAR
	FILE
}

type ServiceEvent {
	message: String!
}

type SessionThread {
	id: SessionThreadId!
	"""
	Whether this is the currently active thread.
	"""
	isCurrent: Boolean!
	"""
	Resolved messages for this thread (as the LLM sees them).
	Each entry carries its own block indexes for shared-node detection.
	"""
	messages: [ThreadMessageEntry!]!
	"""
	Whose turn it is next on this thread.
	"""
	nextTurn: ThreadTurn!
	"""
	Why this thread was created.
	"""
	startReason: ThreadStartReason!
	"""
	System prompt blocks referenced by this thread, in canonical order.
	Each entry carries its global SystemBlockIndex so the TUI can detect
	shared columns across threads (same idx → same content).
	"""
	systemBlocks: [SystemBlockInfo!]!
	"""
	Number of tool definitions exposed to the LLM on this thread.
	"""
	toolDefinitionsCount: Int!
}

scalar SessionThreadId

type Skill {
	body: String!
	createdAt: Timestamp!
	description: String!
	id: SkillId!
	name: String!
	projectId: ProjectId
}

input SkillDeleteInput {
	id: SkillId!
	projectId: ProjectId!
}

type SkillDeletePayload {
	deletedId: SkillId!
}

scalar SkillId

type Subscription {
	"""
	Send a message to an agent and stream back response events.
	"""
	agentSendMessage(agentId: AgentId!, prompt: String!): ChatStreamEvent!
}

type SystemBlockInfo {
	"""
	Global SystemBlockIndex (position in the per-session flat list of all
	system blocks ever pushed). Equal indexes across threads = same content.
	"""
	index: Int!
	kind: SystemBlockKind!
	text: String!
}

enum SystemBlockKind {
	BASE
	BEHAVIORAL
	NOTES
	ROLE
	SKILLS
	SPACES
	TOOLS
}

type TextContent {
	text: String!
}

type ThinkingContent {
	text: String!
}

type ThinkingDeltaEvent {
	text: String!
}

type ThinkingEvent {
	text: String!
}

type ThreadMessageEntry {
	"""
	Global block indexes referenced by this message turn.
	Compare across threads to identify shared content nodes.
	"""
	blockIndexes: [Int!]!
	content: [ChatContentBlock!]!
	"""
	Timestamp of the event that produced this message.
	"""
	recordedAt: Timestamp
	role: ChatMessageRole!
	"""
	Token usage metadata (only present for assistant messages).
	"""
	usage: ThreadMessageUsage
}

type ThreadMessageUsage {
	cacheReadTokens: Int!
	cacheWriteTokens: Int!
	inputTokens: Int!
	model: String!
	outputTokens: Int!
	"""
	Total cost in USD.
	"""
	totalCost: Float!
	totalTokens: Int!
}

enum ThreadStartReason {
	COMPACTION
	CONTEXT_REFRESHED
	INITIAL_THREAD
	ORPHAN
	TOOL_DEFS_UPDATED
}

enum ThreadTurn {
	ASSISTANT
	TOOL_USE
	USER
}

"""
An ISO 8601 UTC timestamp (e.g., 2024-01-15T09:30:00Z). Always in UTC.
"""
scalar Timestamp

type ToolCallInputDeltaEvent {
	partialJson: String!
}

type ToolCallStartEvent {
	name: String!
}

type ToolResultContent {
	content: String!
	isError: Boolean!
	toolUseId: String!
}

type ToolResultEvent {
	content: String
	isError: Boolean!
	name: String!
}

type ToolUseContent {
	input: String!
	name: String!
}

scalar UUID

type UserMessageEvent {
	text: String!
}

scalar Yaml

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: Query
	mutation: Mutation
	subscription: Subscription
}
