type Agent {
	"""
	The sandbox this agent is attached to, if any.
	"""
	attachedSandbox: SandboxAttachment
	id: AgentId!
	name: String!
	role: AgentRole!
	"""
	The agent's conversation session.
	"""
	session: AgentSession!
	workspaceId: WorkspaceId!
}

input AgentAttachSandboxInput {
	agentId: AgentId!
	mode: SandboxAttachmentMode!
	sandboxId: SandboxId!
}

type AgentAttachSandboxPayload {
	agent: Agent!
}

input AgentCreateInput {
	name: String!
	sandboxId: SandboxId
	sandboxMode: SandboxAttachmentMode
	workspaceId: WorkspaceId!
}

type AgentCreatePayload {
	agent: Agent!
}

input AgentDetachSandboxInput {
	agentId: AgentId!
	sandboxId: SandboxId!
}

type AgentDetachSandboxPayload {
	agent: Agent!
}

scalar AgentId

enum AgentRole {
	AGENT
	WORKSPACE_LEAD
}

type AgentSession {
	"""
	Flat chat history: recent user messages and assistant responses.
	Returns the last `last` messages in chronological order.
	"""
	chatHistory(last: Int! = 20): [ChatMessage!]!
	"""
	All threads in this session.
	"""
	threads: [SessionThread!]!
}

type AssistantDoneEvent {
	costUsd: Float
	durationMs: Int
	inputTokens: Int!
	outputTokens: Int!
	turns: Int!
}

type AssistantTextDeltaEvent {
	text: String!
}

type AssistantTextEvent {
	text: String!
}

type AuditEntry {
	actingAgentId: UUID
	actingUserId: UUID
	action: String!
	durationMs: Int
	entrypoint: String
	error: Boolean
	interactionType: String!
	onBehalfOfUserId: UUID
	outcome: String!
	recordedAt: Timestamp!
	tokensReturned: Int
}

input AuditLogQueryInput {
	actingAgentId: AgentId
	action: String
	error: Boolean
	limit: Int! = 20
	outcome: String
	workspaceId: WorkspaceId
}

union ChatContentBlock = TextContent | ToolUseContent | ThinkingContent | ToolResultContent | SandboxNotificationContent

type ChatMessage {
	content: [ChatContentBlock!]!
	role: ChatMessageRole!
	"""
	Ordinal position in the full message history (0-based).
	"""
	sequence: Int!
}

enum ChatMessageRole {
	ASSISTANT
	USER
}

union ChatStreamEvent = UserMessageEvent | AssistantTextEvent | ThinkingEvent | AssistantTextDeltaEvent | ThinkingDeltaEvent | ToolCallStartEvent | ToolCallInputDeltaEvent | ToolResultEvent | AssistantDoneEvent | ErrorEvent | ServiceEvent

type ErrorEvent {
	message: String!
}

input McpCredentialsCreateInput {
	name: String!
	"""
	The scopes to grant, as strings (e.g. "admin", "workspace_admin:<id>").
	"""
	scopes: [String!]!
}

"""
Returned on create — includes the plaintext token (shown only once).
"""
type McpCredentialsCreatePayload {
	mcpCreds: McpCreds!
	"""
	The plaintext token. Only returned once on creation.
	"""
	token: String!
}

input McpCredentialsRevokeInput {
	id: McpCredsId!
}

type McpCredentialsRevokePayload {
	mcpCreds: McpCreds!
}

type McpCreds {
	createdAt: Timestamp!
	id: McpCredsId!
	name: String!
	revoked: Boolean!
	revokedAt: Timestamp
}

scalar McpCredsId

type Me {
	email: String
	githubUsername: String
	id: UUID!
	name: String
}

type Mutation {
	agentAttachSandbox(input: AgentAttachSandboxInput!): AgentAttachSandboxPayload!
	agentCreate(input: AgentCreateInput!): AgentCreatePayload!
	agentDetachSandbox(input: AgentDetachSandboxInput!): AgentDetachSandboxPayload!
	mcpCredentialsCreate(input: McpCredentialsCreateInput!): McpCredentialsCreatePayload!
	mcpCredentialsRevoke(input: McpCredentialsRevokeInput!): McpCredentialsRevokePayload!
	ping: String!
	sandboxCreate(input: SandboxCreateInput!): SandboxCreatePayload!
	sandboxRestart(input: SandboxRestartInput!): SandboxRestartPayload!
	sandboxSuspend(input: SandboxSuspendInput!): SandboxSuspendPayload!
	workspaceCreate(input: WorkspaceCreateInput!): WorkspaceCreatePayload!
	workspaceDelete(input: WorkspaceDeleteInput!): WorkspaceDeletePayload!
	workspaceSecretCreate(input: WorkspaceSecretCreateInput!): WorkspaceSecretCreatePayload!
	workspaceSecretDelete(input: WorkspaceSecretDeleteInput!): WorkspaceSecretDeletePayload!
	workspaceUpdate(input: WorkspaceUpdateInput!): WorkspaceUpdatePayload!
}

"""
Information about pagination in a connection
"""
type PageInfo {
	"""
	When paginating forwards, the cursor to continue.
	"""
	endCursor: String
	"""
	When paginating forwards, are there more items?
	"""
	hasNextPage: Boolean!
	"""
	When paginating backwards, are there more items?
	"""
	hasPreviousPage: Boolean!
	"""
	When paginating backwards, the cursor to continue.
	"""
	startCursor: String
}

type Query {
	"""
	Look up a single agent by ID.
	"""
	agent(id: AgentId!): Agent
	appConfig: Yaml!
	"""
	Query audit log entries.
	"""
	auditLog(input: AuditLogQueryInput!): [AuditEntry!]!
	"""
	Export a thread as Pi-compatible JSONL (v3 format).
	
	When `thread_id` is omitted the current main thread is exported.
	"""
	exportThread(agentId: AgentId!, threadId: SessionThreadId): String!
	"""
	The currently authenticated user, if any.
	"""
	me: Me
	ping: String!
	"""
	Look up a single sandbox by ID.
	"""
	sandbox(id: SandboxId!): Sandbox
	workspace(id: WorkspaceId!): Workspace
	workspaces(after: String, first: Int!): WorkspaceConnection!
}

type Sandbox {
	"""
	Agents currently attached to this sandbox.
	"""
	attachedAgents: [SandboxAgentAttachment!]!
	cpu: String!
	createdAt: Timestamp!
	diskSize: String!
	id: SandboxId!
	lastError: String
	memory: String!
	mountPath: String!
	name: String!
	state: SandboxStateEnum!
	workspaceId: WorkspaceId!
}

type SandboxAgentAttachment {
	agentId: AgentId!
	mode: SandboxAttachmentMode!
}

type SandboxAttachment {
	mode: SandboxAttachmentMode!
	name: String!
	sandboxId: SandboxId!
}

enum SandboxAttachmentMode {
	READ
	WRITE
}

input SandboxCreateInput {
	branch: String
	cpu: String! = "500m"
	diskSize: String! = "10Gi"
	memory: String! = "512Mi"
	mode: SandboxCreateMode!
	name: String!
	repoUrl: String
	workspaceId: WorkspaceId!
}

enum SandboxCreateMode {
	REPO
	SCRATCH
}

type SandboxCreatePayload {
	sandbox: Sandbox!
}

scalar SandboxId

type SandboxNotificationContent {
	mode: String
	operation: SandboxNotificationOperation!
	sandboxName: String!
	"""
	The rendered notification text that was injected into the prompt.
	"""
	text: String!
}

enum SandboxNotificationOperation {
	ATTACH
	DETACH
}

input SandboxRestartInput {
	id: SandboxId!
}

type SandboxRestartPayload {
	sandbox: Sandbox!
}

enum SandboxStateEnum {
	ERRORED
	INITIALIZING
	PROVISIONING
	READY
	SUSPENDED
}

input SandboxSuspendInput {
	id: SandboxId!
}

type SandboxSuspendPayload {
	sandbox: Sandbox!
}

enum SecretTypeEnum {
	ENV_VAR
	FILE
}

type ServiceEvent {
	message: String!
}

type SessionThread {
	id: SessionThreadId!
	"""
	Whether this is the currently active thread.
	"""
	isCurrent: Boolean!
	"""
	Resolved messages for this thread (as the LLM sees them).
	Each entry carries its own block indexes for shared-node detection.
	"""
	messages: [ThreadMessageEntry!]!
	"""
	Whose turn it is next on this thread.
	"""
	nextTurn: ThreadTurn!
	"""
	Why this thread was created.
	"""
	startReason: ThreadStartReason!
}

scalar SessionThreadId

type Skill {
	body: String!
	createdAt: Timestamp!
	description: String!
	id: SkillId!
	name: String!
	workspaceId: WorkspaceId
}

scalar SkillId

type Subscription {
	"""
	Send a message to an agent and stream back response events.
	"""
	agentSendMessage(agentId: AgentId!, prompt: String!): ChatStreamEvent!
}

type TextContent {
	text: String!
}

type ThinkingContent {
	text: String!
}

type ThinkingDeltaEvent {
	text: String!
}

type ThinkingEvent {
	text: String!
}

type ThreadMessageEntry {
	"""
	Global block indexes referenced by this message turn.
	Compare across threads to identify shared content nodes.
	"""
	blockIndexes: [Int!]!
	content: [ChatContentBlock!]!
	"""
	Timestamp of the event that produced this message.
	"""
	recordedAt: Timestamp
	role: ChatMessageRole!
	"""
	Token usage metadata (only present for assistant messages).
	"""
	usage: ThreadMessageUsage
}

type ThreadMessageUsage {
	cacheReadTokens: Int!
	cacheWriteTokens: Int!
	inputTokens: Int!
	model: String!
	outputTokens: Int!
	"""
	Total cost in USD.
	"""
	totalCost: Float!
	totalTokens: Int!
}

enum ThreadStartReason {
	COMPACTION
	CONTEXT_REFRESHED
	INITIAL_THREAD
	ORPHAN
	TOOL_DEFS_UPDATED
}

enum ThreadTurn {
	ASSISTANT
	TOOL_USE
	USER
}

"""
An ISO 8601 UTC timestamp (e.g., 2024-01-15T09:30:00Z). Always in UTC.
"""
scalar Timestamp

type ToolCallInputDeltaEvent {
	partialJson: String!
}

type ToolCallStartEvent {
	name: String!
}

type ToolResultContent {
	content: String!
	isError: Boolean!
	toolUseId: String!
}

type ToolResultEvent {
	content: String
	isError: Boolean!
	name: String!
}

type ToolUseContent {
	input: String!
	name: String!
}

scalar UUID

type UserMessageEvent {
	text: String!
}

type Workspace {
	"""
	All agents in this workspace (lead agent first).
	"""
	agents: [Agent!]!
	createdAt: Timestamp!
	description: String
	id: WorkspaceId!
	"""
	The workspace lead agent.
	"""
	lead: Agent!
	"""
	MCP credentials owned by the current user.
	"""
	mcpCredentials: [McpCreds!]!
	name: String!
	"""
	All sandboxes in this workspace.
	"""
	sandboxes: [Sandbox!]!
	"""
	All secrets in this workspace (metadata only — values are never exposed via GraphQL).
	"""
	secrets: [WorkspaceSecret!]!
	"""
	All skills in this workspace.
	"""
	skills: [Skill!]!
}

type WorkspaceConnection {
	"""
	A list of edges.
	"""
	edges: [WorkspaceEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Workspace!]!
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
}

input WorkspaceCreateInput {
	description: String
	name: String!
}

type WorkspaceCreatePayload {
	workspace: Workspace!
}

input WorkspaceDeleteInput {
	id: WorkspaceId!
}

type WorkspaceDeletePayload {
	workspace: Workspace!
}

"""
An edge in a connection.
"""
type WorkspaceEdge {
	"""
	A cursor for use in pagination
	"""
	cursor: String!
	"""
	The item at the end of the edge
	"""
	node: Workspace!
}

scalar WorkspaceId

type WorkspaceSecret {
	createdAt: Timestamp!
	id: WorkspaceSecretId!
	name: String!
	secretType: SecretTypeEnum!
	workspaceId: WorkspaceId!
}

input WorkspaceSecretCreateInput {
	name: String!
	secretType: SecretTypeEnum!
	value: String!
	workspaceId: WorkspaceId!
}

type WorkspaceSecretCreatePayload {
	workspaceSecret: WorkspaceSecret!
}

input WorkspaceSecretDeleteInput {
	id: WorkspaceSecretId!
}

type WorkspaceSecretDeletePayload {
	deletedId: WorkspaceSecretId!
}

scalar WorkspaceSecretId

input WorkspaceUpdateInput {
	description: String
	id: WorkspaceId!
}

type WorkspaceUpdatePayload {
	workspace: Workspace!
}

scalar Yaml

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: Query
	mutation: Mutation
	subscription: Subscription
}
