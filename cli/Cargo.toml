[package]
name = "galoy-agents-cli"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "galoy-agents"
path = "src/main.rs"

[dependencies]
galoy-agents-core = { path = "../core" }
galoy-agents-mcp-gateway = { path = "../mcp-gateway" }
galoy-agents-web = { path = "../web" }
anyhow = "1"
axum = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
