[workspace]
members = [
  "cli",
  "client",
  "server",
  "lib/concourse-client",
  "lib/zenduty-client",
  "core",
  "core/crates/library",
  "core/crates/tool-cache",
  "core/crates/tool-classifier",
  "mcp-gateway",
  "lib/sandbox",
  "lib/tracing-utils",
  "lib/anthropic-client",
  "lib/openai-client",
  "lib/llm",
  "lib/js-engine",
  "lib/json-schema-ts",
  "lib/github-app",
  "code-assistant/crates/core",
  "code-assistant/crates/cli",
  "images/sandbox/server",
  "images/tunnel-connector",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[profile.dev]
debug = false

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
incremental = false
codegen-units = 64
opt-level = 0
strip = true

[workspace.metadata.crane]
name = "drua"

[workspace.dependencies]
# Internal crates
concourse-client = { path = "lib/concourse-client" }
zenduty-client = { path = "lib/zenduty-client" }
sandbox = { path = "lib/sandbox" }
drua-tracing-utils = { path = "lib/tracing-utils" }
js-engine = { path = "lib/js-engine" }
json-schema-ts = { path = "lib/json-schema-ts" }
code-assistant-core = { path = "code-assistant/crates/core" }
llm = { path = "lib/llm" }
anthropic-client = { path = "lib/anthropic-client" }
openai-client = { path = "lib/openai-client" }
github-app = { path = "lib/github-app" }

# MCP
rmcp = { version = "1.2", features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "macros"] }

# HTTP server
axum = "0.8"

# Vector store (PostgreSQL pgvector)
pgvector = { version = "0.4", features = ["sqlx"] }

# Vector store (SQLite + sqlite-vec)
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
zerocopy = { version = "0.7", features = ["derive"] }

# Parsing
tree-sitter = "0.25"
tree-sitter-rust = "0.23"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["uuid1"] }

# Config
toml = "0.8"
dirs = "6"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "macos-system-configuration"] }

# IDs
uuid = { version = "1", features = ["v4"] }

# Encoding
base64 = "0.22"

# Cryptography
# pkcs8+pem: load Ed25519 keys out of PEM files (connector reads its
# private key from a PEM mount; drua parses public keys from config).
# rand_core: enables SigningKey::generate (used in server tunnel tests).
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }

# Hashing
sha1 = "0.10"
sha2 = "0.10"

# Tokenization
tiktoken = "3.1"

# Randomization
rand = "0.8"

# Async streams
futures = "0.3"

# WebSocket client
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = "2"

# Event sourcing
es-entity = "0.10.35"
derive_builder = "0.20"

# Job processing
job = { version = "0.6", features = ["es-entity"] }
obix = "0.2"

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# Errors
anyhow = "1"
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"
libc = "0.2"

# Telegram bot
teloxide = { version = "0.17", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }

# Embedding (fastembed ONNX in-process)
fastembed = { version = "5", default-features = false, features = ["ort-load-dynamic", "hf-hub-rustls-tls"] }

# ONNX inference (classifier)
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
ndarray = "0.16"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

# Logging / Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-opentelemetry = "0.32.1"
opentelemetry = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31.0", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry-http = "0.31.0"
opentelemetry-semantic-conventions = { version = "0.31.0", features = ["semconv_experimental"] }
