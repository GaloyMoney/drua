server:
  port: 4200
  host: "0.0.0.0"
  secure_cookies: false
  mcp_endpoint: "http://localhost:4200/mcp"
oauth:
  github_client_id: "Ov23li9ZTNnKjiTRwDcb"
  github_redirect_uri: "http://localhost:4200/auth/github/callback"
  github_allowed_teams: []
agents:
  light:
    model: "claude-sonnet-4-20250514"
    max_tokens: 4096
    max_turns: 25
toolsets:
  report:
    enabled: false
  code_assistant:
    db_path: "./data/code-assistant.db"
  concourse:
    enabled: true
    url: https://ci.galoy.io
    team: dev
  mcp_upstreams:
    - name: honeycomb
      url: https://mcp.honeycomb.io/mcp
      category: observability
      category_description: "Distributed traces, SLOs, and query analysis"
    - name: github
      url: https://api.githubcopilot.com/mcp/readonly
      tool_prefix: github
      category: source-control
      category_description: "GitHub repositories, pull requests, issues, and code search"
      allowed_tools:
        - get_file_contents
        - get_commit
        - list_commits
        - list_branches
        - search_code
        - search_repositories
        - pull_request_read
        - list_pull_requests
        - search_pull_requests
        - issue_read
        - list_issues
        - search_issues
    - name: lingo
      url: https://mcp.lingo.dev/account
      auth_header_name: x-api-key
      category: localization
      category_description: "AI-powered localization engine management and translation"
