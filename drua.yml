server:
  port: 4200
  host: "0.0.0.0"
  secure_cookies: false
  mcp_endpoint: "http://localhost:4200/mcp"
oauth:
  login: github
  github_client_id: "Ov23li9ZTNnKjiTRwDcb"
  github_redirect_uri: "http://localhost:4200/auth/github/callback"
  github_allowed_teams: []
agents:
  builtin_roles:
    workspace_lead:
      model: claude-haiku-4-5-20251001
      max_tokens: 4096
      reset_time_delta_seconds: 600
      system:
        - type: text
          text: |
            You are the workspace lead agent. You coordinate tasks,
            answer questions, and use the available tools to help the
            user accomplish their goals. Be concise and action-oriented.
    agent:
      model: claude-haiku-4-5-20251001
      max_tokens: 4096
      reset_time_delta_seconds: 600
      system:
        - type: text
          text: |
            You are an agent operating inside a Drua workspace.
            You work on the tasks assigned to you and, when attached to
            a sandbox, you run commands and edit files inside it. Be
            concise and action-oriented.
sandbox:
  # Local mode spawns the sandbox tool server as a child process per sandbox.
  # Each sandbox lives in <local_repo_root>/.sandboxes/<name>/.
  #
  # Swap to k8s with:
  #   backend:
  #     provider: k8s
  #     namespace: drua-sandboxes
  #     template_name: agent-sandbox
  backend:
    provider: local
    sandbox_spawn_cmd: "cargo run -q -p sandbox-tool-server --"
    local_repo_root: "."

toolsets:
  code_assistant:
    db_path: "./data/code-assistant.db"
  concourse:
    enabled: true
    url: https://ci.galoy.io
    team: dev
  mcp_upstreams:
    - name: honeycomb
      url: https://mcp.honeycomb.io/mcp
      category: observability
      category_description: "Distributed traces, SLOs, and query analysis"
    - name: github
      url: https://api.githubcopilot.com/mcp/readonly
      tool_prefix: github
      category: source-control
      category_description: "GitHub repositories, pull requests, issues, and code search"
      allowed_tools:
        - get_file_contents
        - get_commit
        - list_commits
        - list_branches
        - search_code
        - search_repositories
        - pull_request_read
        - list_pull_requests
        - search_pull_requests
        - issue_read
        - list_issues
        - search_issues
    - name: lingo
      url: https://mcp.lingo.dev/account
      auth_header_name: x-api-key
      category: localization
      category_description: "AI-powered localization engine management and translation"
