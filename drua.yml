server:
  port: 4200
  host: "0.0.0.0"
  secure_cookies: false
  mcp_endpoint: "http://localhost:4200/mcp"
oauth:
  dev_mode_agent_tokens: true
  login: github
  github_client_id: "Ov23li9ZTNnKjiTRwDcb"
  github_redirect_uri: "http://localhost:4200/auth/github/callback"
  github_allowed_teams: []
providers:
  # OpenAI provider names are not aliases:
  # - openai           -> Chat Completions API, uses OPENAI_API_KEY
  # - openai-responses -> Responses API, uses OPENAI_API_KEY
  # - openai-codex     -> Responses API over ChatGPT subscription auth
  - name: openai
    base_url: https://openrouter.ai/api
    models:
      - name: deepseek/deepseek-v3.2
        max_tokens_per_response: 8192
        context_window_tokens: 131072
      - name: deepseek/deepseek-v4-pro
        max_tokens_per_response: 8192
        context_window_tokens: 1048576
      - name: deepseek/deepseek-v4-flash
        max_tokens_per_response: 8192
        context_window_tokens: 1048576
      - name: openai/gpt-5-mini
        max_tokens_per_response: 8192
        context_window_tokens: 400000
      - name: anthropic/claude-sonnet-4.6
        max_tokens_per_response: 8192
        context_window_tokens: 200000
agents:
  # Resolution precedence (highest first):
  #   1. chain_override passed at the call site (workflow definition /
  #      per-step override; GraphQL/web UI creation form)
  #   2. builtin_roles.<role>.chain — optional per-role override
  #   3. default_chain
  default_chain:
    primary: { name: openai/gpt-5-mini, max_tokens: 8192 }
    fallbacks:
      - { name: deepseek/deepseek-v3.2, max_tokens: 8192 }
  builtin_roles:
    project_lead:
      # Optional: chain: { primary: { name: ... }, fallbacks: [ ... ] }
      compaction:
        reset_time_delta_seconds: 18000
        prune_after_seconds: 600
    agent:
      # Optional: chain: { primary: { name: ... }, fallbacks: [ ... ] }
      compaction:
        prune_after_seconds: 600
    workflow_step_agent:
      # Optional: chain: { primary: { name: ... }, fallbacks: [ ... ] }
      compaction:
        prune_after_seconds: 600
library:
  repo_url: "https://github.com/galoymoney/drua-test-library"
  skill_sync_interval_secs: 5
git_proxy:
  # Repos sandboxes are allowed to clone / push through the drua proxy.
  # `owner` / `repo` lookup is case-insensitive — `galoymoney` and
  # `GaloyMoney` match the same entry. `allowed_push_refs` gates push
  # only (pull / clone / fetch are unrestricted modulo the modes
  # list); patterns are globs against the full ref name. Empty list
  # ⇒ no pushes accepted. Restart drua to apply edits.
  allowlist:
    entries:
      - owner: GaloyMoney
        repo: drua
        modes: [pull, push]
        allowed_push_refs:
          # Bot branches only — agents never push directly to main.
          # Open a PR and let humans / CI do the merge.
          - "refs/heads/bot/*"
sandbox:
  # Local mode spawns the sandbox tool server as a child process per sandbox.
  # Each sandbox lives in <local_repo_root>/.sandboxes/<name>/.
  #
  # Swap to k8s with:
  #   backend:
  #     provider: k8s
  #     namespace: drua-sandboxes
  #     template_name: agent-sandbox
  backend:
    provider: local
    sandbox_spawn_cmd: "cargo run -q -p sandbox-tool-server --"
    local_repo_root: "."

toolsets:
  code_assistant:
    db_path: "./data/code-assistant.db"
  concourse:
    enabled: true
    url: https://ci.galoy.io
    team: dev
  zenduty:
    enabled: false
    url: ''
    default_team: 'c634c1cb-405d-451f-a83b-23fa06475e89'
  mcp_upstreams:
    - name: honeycomb
      url: https://mcp.honeycomb.io/mcp
      category: observability
      category_description: "Distributed traces, SLOs, and query analysis"
    - name: github
      url: https://api.githubcopilot.com/mcp/readonly
      tool_prefix: github
      category: source-control
      category_description: "GitHub repositories, pull requests, issues, and code search"
      allowed_tools:
        - get_file_contents
        - get_commit
        - list_commits
        - list_branches
        - search_code
        - search_repositories
        - pull_request_read
        - list_pull_requests
        - search_pull_requests
        - issue_read
        - list_issues
        - search_issues
    - name: github_actions
      url: https://api.githubcopilot.com/mcp/x/actions/readonly
      tool_prefix: github_actions
      category: ci
      category_description: "GitHub Actions workflows, runs, jobs, and logs"
      allowed_tools:
        - actions_list
        - actions_get
        - get_job_logs
    # PR-mutation upstream — local-dev test of separating writes from reads.
    # Auth: GITHUB_PULL_REQUESTS_AUTH_HEADER ("Bearer <PAT>"). Same PAT as
    # the github upstream is fine for now; PAT needs `repo` (or fine-grained
    # `pull_requests: write`) for create. No `required_scopes` locally so
    # any caller can hit it; in prod we'd pin to e.g. `sandbox:*:use`.
    - name: github_pull_requests
      url: https://api.githubcopilot.com/mcp/x/pull_requests
      tool_prefix: github_pr
      category: source-control-write
      category_description: "GitHub PR mutations — create, review, and inline comment replies"
      # Hidden from non-agent subjects (Users, ExportedAgents, Anonymous).
      internal_only: true
      # Minimal whitelist: PR creation, review submission, and inline review
      # comment replies. `merge_pull_request` is deliberately excluded — the
      # heal-flow guardrail forbids merges, and we don't want any agent flow
      # ever discovering it.
      allowed_tools:
        - create_pull_request
        - pull_request_review_write
        - add_reply_to_pull_request_comment
