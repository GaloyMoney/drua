apiVersion: vendir.k14s.io/v1alpha1
kind: Config
directories:
  - path: vendor/agent-sandbox
    contents:
      - path: .
        githubRelease:
          slug: kubernetes-sigs/agent-sandbox
          tag: v0.2.1
          assetNames:
            - manifest.yaml
            - extensions.yaml
          disableAutoChecksumValidation: true
  - path: charts/kubernetes-mcp-server
    contents:
      - path: .
        git:
          url: https://github.com/containers/kubernetes-mcp-server
          ref: v0.0.60
        includePaths:
          - charts/kubernetes-mcp-server/**
        newRootPath: charts/kubernetes-mcp-server
