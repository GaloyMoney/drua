apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "galoyAgents.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
data:
  drua.yml: |-
    server:
      port: {{ .Values.galoyAgents.server.service.port }}
      host: {{ .Values.galoyAgents.config.server.host | quote }}
      secure_cookies: {{ .Values.galoyAgents.config.server.secureCookies }}
      mcp_endpoint: {{ .Values.galoyAgents.config.server.mcpEndpoint | quote }}
      tunnel:
        deployments:
        {{- range $deployment_id, $public_key := .Values.galoyAgents.config.server.tunnel.deployments }}
          {{ $deployment_id }}: |
            {{- $public_key | nindent 12 }}
        {{- end }}
    oauth:
      github_client_id: {{ .Values.galoyAgents.config.oauth.githubClientId | quote }}
      github_redirect_uri: {{ .Values.galoyAgents.config.oauth.githubRedirectUri | quote }}
    {{- if .Values.galoyAgents.config.oauth.githubAllowedTeams }}
      github_allowed_teams:
      {{- range .Values.galoyAgents.config.oauth.githubAllowedTeams }}
        - {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- with .Values.galoyAgents.config.providers }}
    providers:
    {{- range . }}
      - name: {{ .name | quote }}
        {{- with .baseUrl }}
        base_url: {{ . | quote }}
        {{- end }}
        models:
        {{- range .models }}
          - name: {{ .name | quote }}
            max_tokens_per_response: {{ printf "%d" (int .maxTokensPerResponse) }}
            context_window_tokens: {{ printf "%d" (int .contextWindowTokens) }}
            {{- with .effort }}
            effort: {{ . | quote }}
            {{- end }}
            {{- if hasKey . "cacheTtlSeconds" }}
            cache_ttl_seconds: {{ printf "%d" (int .cacheTtlSeconds) }}
            {{- end }}
        {{- end }}
    {{- end }}
    {{- end }}
    agents:
      {{- with .Values.galoyAgents.config.agents.defaultChain }}
      default_chain:
        primary:
          name: {{ .primary.name | quote }}
          {{- with .primary.maxTokens }}
          max_tokens: {{ . }}
          {{- end }}
          {{- with .primary.effort }}
          effort: {{ . | quote }}
          {{- end }}
        {{- with .fallbacks }}
        fallbacks:
          {{- range . }}
          - name: {{ .name | quote }}
            {{- with .maxTokens }}
            max_tokens: {{ . }}
            {{- end }}
            {{- with .effort }}
            effort: {{ . | quote }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
      builtin_roles:
        project_lead:
          {{- with .Values.galoyAgents.config.agents.projectLead.chain }}
          chain:
            primary:
              name: {{ .primary.name | quote }}
              {{- with .primary.maxTokens }}
              max_tokens: {{ . }}
              {{- end }}
              {{- with .primary.effort }}
              effort: {{ . | quote }}
              {{- end }}
            {{- with .fallbacks }}
            fallbacks:
              {{- range . }}
              - name: {{ .name | quote }}
                {{- with .maxTokens }}
                max_tokens: {{ . }}
                {{- end }}
                {{- with .effort }}
                effort: {{ . | quote }}
                {{- end }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- with .Values.galoyAgents.config.agents.projectLead.compaction }}
          compaction:
            {{- with .resetTimeDeltaSeconds }}
            reset_time_delta_seconds: {{ . }}
            {{- end }}
            {{- with .pruneAfterSeconds }}
            prune_after_seconds: {{ . }}
            {{- end }}
          {{- end }}
          {{- with .Values.galoyAgents.config.agents.projectLead.breaker }}
          breaker:
            {{- if hasKey . "enabled" }}
            enabled: {{ .enabled }}
            {{- end }}
            {{- if hasKey . "consecutiveErrorTurns" }}
            consecutive_error_turns: {{ .consecutiveErrorTurns }}
            {{- end }}
            {{- if hasKey . "identicalFailingCalls" }}
            identical_failing_calls: {{ .identicalFailingCalls }}
            {{- end }}
            {{- if hasKey . "consecutiveMaxTokens" }}
            consecutive_max_tokens: {{ .consecutiveMaxTokens }}
            {{- end }}
            {{- if hasKey . "maxTurnsPerPrompt" }}
            max_turns_per_prompt: {{ .maxTurnsPerPrompt }}
            {{- end }}
          {{- end }}
        {{- with .Values.galoyAgents.config.agents.agent }}
        agent:
          {{- with .chain }}
          chain:
            primary:
              name: {{ .primary.name | quote }}
              {{- with .primary.maxTokens }}
              max_tokens: {{ . }}
              {{- end }}
              {{- with .primary.effort }}
              effort: {{ . | quote }}
              {{- end }}
            {{- with .fallbacks }}
            fallbacks:
              {{- range . }}
              - name: {{ .name | quote }}
                {{- with .maxTokens }}
                max_tokens: {{ . }}
                {{- end }}
                {{- with .effort }}
                effort: {{ . | quote }}
                {{- end }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- with .compaction }}
          compaction:
            {{- with .resetTimeDeltaSeconds }}
            reset_time_delta_seconds: {{ . }}
            {{- end }}
            {{- with .pruneAfterSeconds }}
            prune_after_seconds: {{ . }}
            {{- end }}
          {{- end }}
          {{- with .breaker }}
          breaker:
            {{- if hasKey . "enabled" }}
            enabled: {{ .enabled }}
            {{- end }}
            {{- if hasKey . "consecutiveErrorTurns" }}
            consecutive_error_turns: {{ .consecutiveErrorTurns }}
            {{- end }}
            {{- if hasKey . "identicalFailingCalls" }}
            identical_failing_calls: {{ .identicalFailingCalls }}
            {{- end }}
            {{- if hasKey . "consecutiveMaxTokens" }}
            consecutive_max_tokens: {{ .consecutiveMaxTokens }}
            {{- end }}
            {{- if hasKey . "maxTurnsPerPrompt" }}
            max_turns_per_prompt: {{ .maxTurnsPerPrompt }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- with .Values.galoyAgents.config.agents.workflowStepAgent }}
        workflow_step_agent:
          {{- with .chain }}
          chain:
            primary:
              name: {{ .primary.name | quote }}
              {{- with .primary.maxTokens }}
              max_tokens: {{ . }}
              {{- end }}
              {{- with .primary.effort }}
              effort: {{ . | quote }}
              {{- end }}
            {{- with .fallbacks }}
            fallbacks:
              {{- range . }}
              - name: {{ .name | quote }}
                {{- with .maxTokens }}
                max_tokens: {{ . }}
                {{- end }}
                {{- with .effort }}
                effort: {{ . | quote }}
                {{- end }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- with .compaction }}
          compaction:
            {{- with .resetTimeDeltaSeconds }}
            reset_time_delta_seconds: {{ . }}
            {{- end }}
            {{- with .pruneAfterSeconds }}
            prune_after_seconds: {{ . }}
            {{- end }}
          {{- end }}
          {{- with .breaker }}
          breaker:
            {{- if hasKey . "enabled" }}
            enabled: {{ .enabled }}
            {{- end }}
            {{- if hasKey . "consecutiveErrorTurns" }}
            consecutive_error_turns: {{ .consecutiveErrorTurns }}
            {{- end }}
            {{- if hasKey . "identicalFailingCalls" }}
            identical_failing_calls: {{ .identicalFailingCalls }}
            {{- end }}
            {{- if hasKey . "consecutiveMaxTokens" }}
            consecutive_max_tokens: {{ .consecutiveMaxTokens }}
            {{- end }}
            {{- if hasKey . "maxTurnsPerPrompt" }}
            max_turns_per_prompt: {{ .maxTurnsPerPrompt }}
            {{- end }}
          {{- end }}
        {{- end }}
    toolsets:
      code_assistant:
        db_path: {{ .Values.galoyAgents.config.codeAssistant.dbPath | quote }}
      concourse:
        enabled: {{ .Values.galoyAgents.config.concourse.enabled }}
        url: {{ .Values.galoyAgents.config.concourse.url | quote }}
        team: {{ .Values.galoyAgents.config.concourse.team | quote }}
      {{- with .Values.galoyAgents.config.zenduty }}
      zenduty:
        enabled: {{ .enabled | default false }}
        {{- with .url }}
        url: {{ . | quote }}
        {{- end }}
        {{- with .defaultTeam }}
        default_team: {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.galoyAgents.config.compose }}
      compose:
        max_tool_calls: {{ printf "%d" (int .maxToolCalls) }}
        max_tool_result_bytes: {{ printf "%d" (int .maxToolResultBytes) }}
        max_return_bytes: {{ printf "%d" (int .maxReturnBytes) }}
        max_console_bytes: {{ printf "%d" (int .maxConsoleBytes) }}
        memory_limit_bytes: {{ printf "%d" (int .memoryLimitBytes) }}
        stack_limit_bytes: {{ printf "%d" (int .stackLimitBytes) }}
        timeout_ms: {{ printf "%d" (int .timeoutMs) }}
      {{- end }}
      {{- with .Values.galoyAgents.config.tunnelLogTools }}
      tunnel_log_tools:
        {{- range $toolset, $tools := . }}
        {{ $toolset }}:
          {{- range $tools }}
          - {{ . | quote }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- $hasUpstreams := .Values.galoyAgents.config.mcpUpstreams }}
      {{- $k8sMcp := index .Values "kubernetes-mcp-server" }}
      {{- $pgMcp := .Values.galoyAgents.postgresMcp }}
      {{- if or $hasUpstreams (and $k8sMcp $k8sMcp.enabled) (and $pgMcp $pgMcp.enabled) }}
      mcp_upstreams:
      {{- range .Values.galoyAgents.config.mcpUpstreams }}
        - name: {{ .name | quote }}
          url: {{ .url | quote }}
          {{- if .authHeaderName }}
          auth_header_name: {{ .authHeaderName | quote }}
          {{- end }}
          {{- if hasKey . "authRequired" }}
          auth_required: {{ .authRequired }}
          {{- end }}
          {{- if .category }}
          category: {{ .category | quote }}
          {{- end }}
          {{- if .categoryDescription }}
          category_description: {{ .categoryDescription | quote }}
          {{- end }}
          {{- if .toolPrefix }}
          tool_prefix: {{ .toolPrefix | quote }}
          {{- end }}
          {{- if .allowedTools }}
          allowed_tools:
          {{- range .allowedTools }}
            - {{ . | quote }}
          {{- end }}
          {{- end }}
          {{- if .logTools }}
          log_tools:
          {{- range .logTools }}
            - {{ . | quote }}
          {{- end }}
          {{- end }}
          {{- if .documentTools }}
          document_tools:
          {{- range .documentTools }}
            - {{ . | quote }}
          {{- end }}
          {{- end }}
          {{- if .requiredScopes }}
          required_scopes:
          {{- range .requiredScopes }}
            - {{ . | quote }}
          {{- end }}
          {{- end }}
          {{- if .internalOnly }}
          internal_only: true
          {{- end }}
          {{- if .authMode }}
          auth_mode: {{ .authMode | quote }}
          {{- end }}
      {{- end }}
      {{- if and $k8sMcp $k8sMcp.enabled }}
        - name: "kubernetes"
          url: "http://{{ .Release.Name }}-kubernetes-mcp-server:{{ $k8sMcp.service.port }}/mcp"
          auth_required: false
          tool_prefix: "k8s"
          category: "infrastructure"
          category_description: "Kubernetes cluster operations — pods, logs, events, deployments"
          required_scopes:
            - "admin"
          allowed_tools:
            - "events_list"
            - "namespaces_list"
            - "nodes_top"
            - "nodes_stats_summary"
            - "pods_list"
            - "pods_list_in_namespace"
            - "pods_get"
            - "pods_top"
            - "pods_log"
            - "resources_list"
            - "resources_get"
          log_tools:
            - "pods_log"
            - "nodes_log"
      {{- end }}
      {{- if and $pgMcp $pgMcp.enabled }}
        - name: "postgres"
          url: "http://{{ template "galoyAgents.postgresMcp.fullname" . }}:{{ $pgMcp.service.port }}/mcp"
          auth_required: false
          tool_prefix: "pg"
          category: "database"
          category_description: "Drua's own PostgreSQL — schema inspection and read-only SQL"
          required_scopes:
            - "admin"
      {{- end }}
      {{- end }}
    {{- with .Values.galoyAgents.config.library }}
    library:
      {{- with .dataDir }}
      data_dir: {{ . | quote }}
      {{- end }}
      {{- with .repoUrl }}
      repo_url: {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- with .Values.galoyAgents.config.toolCaching }}
    tool_caching:
      {{- /* hasKey, not `with`: these are byte counts and `with` treats 0
             as empty, so `minHiddenBytes: 0` — how you disable the floor
             for a tool — would silently fall back to the crate default. */}}
      {{- if hasKey . "genericThresholdBytes" }}
      generic_threshold_bytes: {{ .genericThresholdBytes }}
      {{- end }}
      {{- if hasKey . "minHiddenBytes" }}
      min_hidden_bytes: {{ .minHiddenBytes }}
      {{- end }}
      {{- if hasKey . "documentMinHiddenBytes" }}
      document_min_hidden_bytes: {{ .documentMinHiddenBytes }}
      {{- end }}
      {{- if hasKey . "minHiddenPerPathBytes" }}
      min_hidden_per_path_bytes: {{ .minHiddenPerPathBytes }}
      {{- end }}
      {{- with .perTool }}
      per_tool:
        {{- range $tool, $override := . }}
        {{ $tool }}:
          {{- if hasKey $override "genericThresholdBytes" }}
          generic_threshold_bytes: {{ $override.genericThresholdBytes }}
          {{- end }}
          {{- if hasKey $override "minHiddenBytes" }}
          min_hidden_bytes: {{ $override.minHiddenBytes }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- if .Values.galoyAgents.config.githubApp.enabled }}
    github_app:
      client_id: {{ .Values.galoyAgents.config.githubApp.clientId | quote }}
      installation_id: {{ .Values.galoyAgents.config.githubApp.installationId | quote }}
    {{- end }}
    {{- with .Values.galoyAgents.config.gitProxy }}
    git_proxy:
      {{- with .mirrorRoot }}
      mirror_root: {{ . | quote }}
      {{- end }}
      {{- with .mirrorTtlSeconds }}
      mirror_ttl_seconds: {{ . }}
      {{- end }}
      allowlist:
        entries:
        {{- range .allowlist.entries }}
          - owner: {{ .owner | quote }}
            repo: {{ .repo | quote }}
            modes: {{ .modes | toJson }}
            {{- with .allowedPushRefs }}
            allowed_push_refs:
            {{- range . }}
              - {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .upstreamUrl }}
            upstream_url: {{ . | quote }}
            {{- end }}
        {{- end }}
    {{- end }}
    {{- if .Values.sandbox.namespace }}
    # Sandbox provisioning. Without this section the binary defaults to
    # SandboxBackendConfig::Local which tries to `cargo run` the
    # sandbox-tool-server — fine for local dev, broken in the prod image
    # (no cargo, no source). Render the K8s backend whenever the chart
    # has the sandbox subchart configured.
    sandbox:
      backend:
        provider: k8s
        namespace: {{ .Values.sandbox.namespace | quote }}
        template_name: {{ .Values.sandbox.templateName | quote }}
        {{- with .Values.sandbox.persistence }}
        storage_class: {{ .storageClassName | quote }}
        mount_path: {{ .mountPath | quote }}
        {{- if and .nixStore .nixStore.enabled }}
        nix_store:
          storage_class: {{ default .storageClassName .nixStore.storageClassName | quote }}
          size: {{ .nixStore.size | quote }}
        {{- end }}
        {{- end }}
    {{- end }}
