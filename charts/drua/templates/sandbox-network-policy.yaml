{{- if .Values.sandbox.enabled }}
# Restrict sandbox ingress to the drua server, but allow sandbox egress to the
# open internet. Nix/Cachix traffic uses the sandbox NIX_CONFIG directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ template "galoyAgents.fullname" . }}-sandbox-isolation
  namespace: {{ include "galoyAgents.sandboxNamespace" . }}
  labels:
    app: {{ template "galoyAgents.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: sandbox
  policyTypes:
  - Ingress
  - Egress
  # Ingress: only allow from drua server (exec proxy).
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Release.Namespace }}
      podSelector:
        matchLabels:
          app: {{ template "galoyAgents.fullname" . }}
          release: {{ .Release.Name }}
  egress:
  - {}
{{- end }}
