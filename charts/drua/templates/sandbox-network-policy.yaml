{{- if .Values.sandbox.enabled }}
# Default-deny all ingress and egress for sandbox pods, then allow specific traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ template "galoyAgents.fullname" . }}-sandbox-isolation
  namespace: {{ include "galoyAgents.sandboxNamespace" . }}
  labels:
    app: {{ template "galoyAgents.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: sandbox
  policyTypes:
  - Ingress
  - Egress
  # Ingress: only allow from drua server (exec proxy)
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Release.Namespace }}
      podSelector:
        matchLabels:
          app: {{ template "galoyAgents.fullname" . }}
          release: {{ .Release.Name }}
  egress:
  # 1. DNS — allow kube-dns for internal service resolution
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  # 2. Dashboard callback — drua server ClusterIP
  - ports:
    - protocol: TCP
      port: {{ .Values.galoyAgents.server.service.port }}
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Release.Namespace }}
      podSelector:
        matchLabels:
          app: {{ template "galoyAgents.fullname" . }}
          release: {{ .Release.Name }}
  # 3. OTel collector — allow trace export. 4317 is OTLP/gRPC (what
  # drua_tracing_utils uses via .with_tonic()), 4318 is OTLP/HTTP.
  # Without 4317 the sandbox-tool-server's exporter times out
  # connecting to the collector and `service.name=drua-sandbox`
  # spans never reach Honeycomb.
  {{- if .Values.sandbox.otelCollectorNamespace }}
  - ports:
    - protocol: TCP
      port: 4317
    - protocol: TCP
      port: 4318
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.sandbox.otelCollectorNamespace }}
  {{- end }}
  {{- if .Values.sandbox.nixCacheProxy.enabled }}
  # 4. Nix binary cache proxy — sandboxes fetch substitutes from the
  # in-cluster reverse cache, not directly from public Cachix/NixOS hosts.
  - ports:
    - protocol: TCP
      port: {{ .Values.sandbox.nixCacheProxy.service.port }}
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Release.Namespace }}
      podSelector:
        matchLabels:
          app: {{ template "galoyAgents.fullname" . }}
          release: {{ .Release.Name }}
          app.kubernetes.io/component: sandbox-nix-cache-proxy
  {{- end }}
  {{- if .Values.sandbox.forwardProxy.enabled }}
  # 5. Forward HTTPS proxy — sandboxes fetch flake inputs through a
  # CONNECT-capable proxy with a domain allowlist. Only the nix daemon
  # inside the sandbox uses this; the agent shell has no proxy env vars.
  - ports:
    - protocol: TCP
      port: {{ .Values.sandbox.forwardProxy.service.port }}
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Release.Namespace }}
      podSelector:
        matchLabels:
          app: {{ template "galoyAgents.fullname" . }}
          release: {{ .Release.Name }}
          app.kubernetes.io/component: sandbox-forward-proxy
  {{- end }}
{{- end }}
