{{- if .Values.sandbox.enabled }}
# Default-deny all ingress and egress for sandbox pods, then allow specific traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ template "galoyAgents.fullname" . }}-sandbox-isolation
  namespace: {{ include "galoyAgents.sandboxNamespace" . }}
  labels:
    app: {{ template "galoyAgents.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: sandbox
  policyTypes:
  - Ingress
  - Egress
  # Ingress: only allow from drua server (exec proxy)
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Release.Namespace }}
      podSelector:
        matchLabels:
          app: {{ template "galoyAgents.fullname" . }}
          release: {{ .Release.Name }}
  egress:
  # 1. DNS — allow kube-dns for internal service resolution
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  # 2. Dashboard callback — drua server ClusterIP
  - ports:
    - protocol: TCP
      port: {{ .Values.galoyAgents.server.service.port }}
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Release.Namespace }}
      podSelector:
        matchLabels:
          app: {{ template "galoyAgents.fullname" . }}
          release: {{ .Release.Name }}
  # 3. OTel collector — allow trace export. 4317 is OTLP/gRPC (what
  # drua_tracing_utils uses via .with_tonic()), 4318 is OTLP/HTTP.
  # Without 4317 the sandbox-tool-server's exporter times out
  # connecting to the collector and `service.name=drua-sandbox`
  # spans never reach Honeycomb.
  {{- if .Values.sandbox.otelCollectorNamespace }}
  - ports:
    - protocol: TCP
      port: 4317
    - protocol: TCP
      port: 4318
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.sandbox.otelCollectorNamespace }}
  {{- end }}
  # No general non-RFC1918 egress. Memo `019dfebc` M5 kill-switch:
  # all GitHub traffic flows through `drua-internal/git/...` (covered
  # by rule 2 above). Anything outside the allow-listed paths
  # (kube-dns, drua-server, OTel) is denied.
  #
  # Workflows that still need external HTTP for non-git tasks (test
  # fixtures hitting third-party APIs, npm install) require a
  # per-domain proxy in the drua namespace. Audit run logs from M3/M4
  # before flipping the upgrade for a project.
{{- end }}
