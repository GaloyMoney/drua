{{- /* Sandbox RBAC — grants the main app SA access to sandbox CRs in the sandbox namespace */ -}}
{{- if .Values.sandbox.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ template "drua.fullname" . }}-sandbox
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "drua.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "drua.fullname" . }}-sandbox-manager
  namespace: {{ include "drua.sandboxNamespace" . }}
  labels:
    app: {{ template "drua.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
rules:
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes/status"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "create"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec", "pods/attach"]
  verbs: ["get", "create"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list"]
- apiGroups: ["extensions.agents.x-k8s.io"]
  resources: ["sandboxtemplates"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "drua.fullname" . }}-sandbox-manager
  namespace: {{ include "drua.sandboxNamespace" . }}
  labels:
    app: {{ template "drua.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ template "drua.fullname" . }}-sandbox-manager
subjects:
- kind: ServiceAccount
  name: {{ template "drua.fullname" . }}-sandbox
  namespace: {{ .Release.Namespace }}
---
# TokenReview — allows the server to validate SA tokens presented by sandbox agents
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ template "drua.fullname" . }}-token-reviewer
  labels:
    app: {{ template "drua.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
rules:
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ template "drua.fullname" . }}-token-reviewer
  labels:
    app: {{ template "drua.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ template "drua.fullname" . }}-token-reviewer
subjects:
- kind: ServiceAccount
  name: {{ template "drua.fullname" . }}-sandbox
  namespace: {{ .Release.Namespace }}
{{- end }}
