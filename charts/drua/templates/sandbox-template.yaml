{{- if .Values.sandbox.enabled }}
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: {{ .Values.sandbox.templateName }}
  namespace: {{ include "galoyAgents.sandboxNamespace" . }}
  labels:
    app: {{ template "galoyAgents.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
spec:
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/component: sandbox
    spec:
      runtimeClassName: {{ .Values.sandbox.runtimeClassName }}
      tolerations:
      - key: {{ .Values.sandbox.nodePool.taintKey }}
        operator: Equal
        value: {{ .Values.sandbox.nodePool.taintValue }}
        effect: NoSchedule
      nodeSelector:
        {{- toYaml .Values.sandbox.nodeSelector | nindent 8 }}
      automountServiceAccountToken: false
      containers:
      - name: sandbox
        {{- if .Values.sandbox.image.digest }}
        image: {{ .Values.sandbox.image.repository }}@{{ .Values.sandbox.image.digest }}
        {{- else }}
        image: {{ .Values.sandbox.image.repository }}:{{ .Values.sandbox.image.tag }}
        {{- end }}
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          {{- toYaml .Values.sandbox.resources | nindent 10 }}
        env:
        {{- range .Values.sandbox.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        {{- if .Values.galoyAgents.tracing }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.galoyAgents.tracing.otelExporterOtlpEndpoint | quote }}
        - name: OTEL_SERVICE_NAME
          value: {{ .Values.galoyAgents.tracing.sandboxServiceName | quote }}
        {{- end }}
        {{- if .Values.sandbox.mcpGatewayUrl }}
        - name: MCP_GATEWAY_URL
          value: {{ .Values.sandbox.mcpGatewayUrl | quote }}
        {{- end }}
        {{- if or .Values.sandbox.nixSubstituters (and .Values.sandbox.attic.enabled .Values.sandbox.attic.publicKey) }}
        - name: NIX_CONFIG
          value: |-
            substituters = {{- if and .Values.sandbox.attic.enabled .Values.sandbox.attic.publicKey }} {{ include "galoyAgents.attic.cacheUrl" . }}{{- end }}{{ range .Values.sandbox.nixSubstituters }} {{ .url }}{{ end }} https://cache.nixos.org/
            trusted-public-keys = {{- if and .Values.sandbox.attic.enabled .Values.sandbox.attic.publicKey }} {{ .Values.sandbox.attic.publicKey }}{{- end }}{{ range .Values.sandbox.nixSubstituters }} {{ .publicKey }}{{ end }} cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
        {{- end }}
        volumeMounts:
        - name: mcp-token
          mountPath: /var/run/secrets/galoy-agents
          readOnly: true
        - name: project-secrets
          mountPath: /run/secrets
      volumes:
      - name: project-secrets
        emptyDir:
          medium: Memory
      - name: mcp-token
        projected:
          sources:
          - serviceAccountToken:
              audience: {{ .Values.sandbox.saTokenAudience | default "galoy-agents-mcp" }}
              expirationSeconds: 3600
              path: token
      dnsConfig:
        nameservers:
        - "8.8.8.8"
        - "1.1.1.1"
  networkPolicyManagement: {{ .Values.sandbox.networkPolicyManagement }}
{{- end }}
