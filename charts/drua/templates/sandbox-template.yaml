{{- if .Values.sandbox.enabled }}
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: {{ .Values.sandbox.templateName }}
  namespace: {{ include "galoyAgents.sandboxNamespace" . }}
  labels:
    app: {{ template "galoyAgents.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
spec:
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/component: sandbox
    spec:
      runtimeClassName: {{ .Values.sandbox.runtimeClassName }}
      tolerations:
      - key: {{ .Values.sandbox.nodePool.taintKey }}
        operator: Equal
        value: {{ .Values.sandbox.nodePool.taintValue }}
        effect: NoSchedule
      nodeSelector:
        {{- toYaml .Values.sandbox.nodeSelector | nindent 8 }}
      automountServiceAccountToken: false
      containers:
      - name: sandbox
        {{- if .Values.sandbox.image.digest }}
        image: {{ .Values.sandbox.image.repository }}@{{ .Values.sandbox.image.digest }}
        {{- else }}
        image: {{ .Values.sandbox.image.repository }}:{{ .Values.sandbox.image.tag }}
        {{- end }}
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          {{- toYaml .Values.sandbox.resources | nindent 10 }}
        env:
        {{- range .Values.sandbox.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        {{- if .Values.galoyAgents.tracing }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.galoyAgents.tracing.otelExporterOtlpEndpoint | quote }}
        - name: OTEL_SERVICE_NAME
          value: {{ .Values.galoyAgents.tracing.sandboxServiceName | quote }}
        {{- end }}
        {{- if .Values.sandbox.mcpGatewayUrl }}
        - name: MCP_GATEWAY_URL
          value: {{ .Values.sandbox.mcpGatewayUrl | quote }}
        {{- end }}
        - name: DRUA_GIT_PROXY_URL
          # Override via `sandbox.gitProxyUrl`. Defaults to the
          # in-cluster service URL — see `galoyAgents.gitProxyUrl`.
          value: {{ .Values.sandbox.gitProxyUrl | default (include "galoyAgents.gitProxyUrl" .) | quote }}
        {{- if or .Values.sandbox.nixSubstituters .Values.sandbox.nixNetrc.enabled }}
        - name: NIX_CONFIG
          value: |-
{{ include "galoyAgents.sandbox.nixConfig" . | indent 12 }}
        {{- end }}
        volumeMounts:
        # Repurposed from the previous MCP-only volume (memo `019dfebc`
        # §3.2). Audience is now the git-proxy audience; same projected
        # token covers MCP + git-proxy + future SA-authed paths.
        - name: sa-token
          mountPath: /var/run/secrets/galoy-agents-git
          readOnly: true
        - name: project-secrets
          mountPath: /run/secrets
        {{- if .Values.sandbox.nixNetrc.enabled }}
        - name: nix-netrc
          mountPath: {{ .Values.sandbox.nixNetrc.mountPath | quote }}
          subPath: {{ .Values.sandbox.nixNetrc.secret.key | quote }}
          readOnly: true
        {{- end }}
      volumes:
      - name: project-secrets
        emptyDir:
          medium: Memory
      - name: sa-token
        projected:
          sources:
          - serviceAccountToken:
              audience: {{ .Values.sandbox.saTokenAudience | default "galoy-agents-git" }}
              expirationSeconds: 3600
              path: token
      {{- if .Values.sandbox.nixNetrc.enabled }}
      - name: nix-netrc
        secret:
          secretName: {{ include "galoyAgents.sandbox.nixNetrcSecretName" . }}
          defaultMode: 256
          items:
          - key: {{ .Values.sandbox.nixNetrc.secret.key | quote }}
            path: {{ .Values.sandbox.nixNetrc.secret.key | quote }}
      {{- end }}
      dnsConfig:
        nameservers:
        - "8.8.8.8"
        - "1.1.1.1"
  networkPolicyManagement: {{ .Values.sandbox.networkPolicyManagement }}
{{- end }}
