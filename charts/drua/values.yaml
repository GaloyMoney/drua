fullnameOverride: ""
nameOverride: ""
galoyAgents:
  resources: {}
  tracing:
    serviceName: galoy-agents-dev
    sandboxServiceName: galoy-agents-dev-sandbox
    otelExporterOtlpEndpoint: "http://localhost:4317"
  server:
    service:
      type: ClusterIP
      port: 5254
      annotations: {}
  ingress:
    enabled: false
    host: ""
    ingressClassName: ""
    annotations: {}
    tls: []
  labels: {}
  image:
    repository: us.gcr.io/galoyorg/galoy-agents
    digest: "sha256:69a3157b6ad60c04e5514e1c6fcad69cf234fff2a644b42fc3e1f3df24525fcd"
    tag: edge
  replicas: 1
  annotations:
  config:
    server:
      host: "0.0.0.0"
      secureCookies: true
      mcpEndpoint: ""
      tunnel:
        deployments: {}
    oauth:
      githubClientId: ""
      githubRedirectUri: ""
      githubAllowedTeams: []
    ## LLM providers and their models. Each model declares token limits
    ## used for compaction and prompt sizing.
    providers:
      - name: openai
        baseUrl: https://openrouter.ai/api
        models:
          - name: deepseek/deepseek-v3.2
            maxTokensPerResponse: 8192
            contextWindowTokens: 131072
          - name: deepseek/deepseek-v4-pro
            maxTokensPerResponse: 8192
            contextWindowTokens: 1048576
          - name: deepseek/deepseek-v4-flash
            maxTokensPerResponse: 8192
            contextWindowTokens: 1048576
          - name: openai/gpt-5-mini
            maxTokensPerResponse: 8192
            contextWindowTokens: 400000
          - name: anthropic/claude-sonnet-4.6
            maxTokensPerResponse: 8192
            contextWindowTokens: 200000
    ## Per-role defaults applied when an agent with that role is created.
    ## All three of `projectLead`, `agent`, and `workflowStepAgent` are
    ## REQUIRED — the binary refuses to start if any of
    ## `agents.builtin_roles.project_lead`,
    ## `agents.builtin_roles.agent`, or
    ## `agents.builtin_roles.workflow_step_agent` is missing.
    ##
    ## Resolution precedence (highest first):
    ##   1. chain_override passed at the call site (workflow definition /
    ##      per-step override; GraphQL/web UI creation form)
    ##   2. agents.<role>.chain — optional per-role override
    ##   3. agents.defaultChain
    ##
    ## `defaultChain` accepts the full object form below. Workflow agents
    ## share `defaultChain`; per-workflow overrides live on the
    ## WorkflowDefinition entity itself rather than a separate config key.
    agents:
      defaultChain:
        primary: {name: "openai/gpt-5-mini", maxTokens: 8192}
        fallbacks:
          - {name: "deepseek/deepseek-v3.2", maxTokens: 8192}
      projectLead:
        ## Optional per-role chain override:
        # chain:
        #   primary: { name: "..." }
        #   fallbacks: [ ... ]
        compaction:
          ## When a user message arrives more than this many seconds after
          ## the previous assistant response, start a fresh thread.
          resetTimeDeltaSeconds: 600
          ## Cache-aware opportunistic prune trigger: once this many
          ## seconds have passed since the last assistant response the
          ## provider's prompt cache is cold, so pruning is free.
          ## Anthropic's default cache window is ≈ 300s. Omit / leave
          ## unset to disable the time-based path entirely (token-budget
          ## pruning still applies).
          pruneAfterSeconds: 300
      agent:
        compaction:
          resetTimeDeltaSeconds: 600
          pruneAfterSeconds: 300
      workflowStepAgent:
        ## Workflow-step agents share the default chain unless this
        ## block sets its own. No `resetTimeDeltaSeconds` — workflow
        ## step sessions are short-lived (one terminal `submit_output`
        ## call); the time-based thread reset only makes sense for
        ## long-lived interactive `projectLead` sessions.
        compaction:
          pruneAfterSeconds: 300
    codeAssistant:
      dbPath: "/data/code-assistant/code-assistant.db"
    concourse:
      enabled: false
      url: ""
      team: ""
    ## Smart-HTTP git proxy. Sandbox `git clone` / `git push` traffic is
    ## rewritten to flow through `drua-internal/git/...`; the proxy
    ## validates against the global allow-list and forwards upstream
    ## using a fresh GitHub App installation token. See memo 019dfebc.
    ##
    ## `allowedPushRefs` is push-only — pull / clone / fetch is
    ## unrestricted modulo the `modes` list. Lookup on (owner, repo)
    ## is case-insensitive. Empty entries list = no repos allowed.
    gitProxy:
      ## On-disk root for per-repo bare mirrors. Backed by an emptyDir
      ## volume — every pod restart re-clones each repo on first access.
      ## A PVC was tried but RWO + RollingUpdate deadlocks the deploy
      ## (new pod waits for the old pod's volume detach).
      mirrorRoot: "/data/git-proxy-mirrors"
      ## Pulls within this window reuse the existing mirror without
      ## re-fetching upstream. github → mirror sync lag is at most
      ## this many seconds. Pushes from the sandbox don't need
      ## upstream fetches (objects are written locally then pushed
      ## out by the proxy itself).
      mirrorTtlSeconds: 300
      allowlist:
        entries: []
        ## - owner: GaloyMoney
        ##   repo: drua
        ##   modes: [pull, push]
        ##   allowedPushRefs:
        ##     - refs/heads/bot/*
    zenduty:
      enabled: false
      url: ""
      defaultTeam: ""
    ## JS-engine sandbox limits for the `compose` top-level tool. Each
    ## key maps 1:1 to a JsEngine setter; missing keys fall back to the
    ## drua-core defaults (50 calls / 32 MiB per inner tool result /
    ## 100 KiB final return / 64 MiB / 512 KiB / 120 s default / 300 s max).
    ## Byte-valued limits are quoted to keep YAML from auto-promoting them
    ## to float64 — Helm's serializer otherwise renders e.g. 16777216 as
    ## "1.6777216e+07", which Rust serde rejects for usize fields.
    compose:
      maxToolCalls: 50
      ## Per inner-tool-result cap. Scripts may pull large payloads
      ## (logs, manifests) and filter them before returning. Sized to
      ## hold realistic Concourse build logs (95–99th percentile).
      maxToolResultBytes: "33554432"
      ## Final-return hard ceiling vs runaway scripts. Compose
      ## self-curates oversize returns via the walker (4 KiB
      ## threshold) and persists full bytes to `tool_invocations`
      ## for `tool_output_fetch` recovery — so this needs to sit
      ## well above any realistic tool output (concourse logs
      ## ~280 KiB, cargo logs in MiB) to avoid pre-empting the
      ## walker. Pathological scripts get caught here.
      maxReturnBytes: "16777216"
      ## Console buffer cap. Tail-truncated when exceeded — newest lines
      ## kept, oldest dropped. ~1% of agent context at 8 KiB.
      maxConsoleBytes: "8192"
      ## JS heap. Must be ≥ 2× maxToolResultBytes so scripts have working
      ## headroom for split / filter / sort over the parsed payload.
      memoryLimitBytes: "67108864"
      stackLimitBytes: "524288"
      defaultTimeoutMs: 120000
      maxTimeoutMs: 300000
    mcpUpstreams: []
    # - name: honeycomb
    #   url: https://mcp.honeycomb.io/mcp
    #   category: observability
    #   categoryDescription: "Distributed traces, SLOs, and query analysis"
    # - name: github
    #   url: https://api.githubcopilot.com/mcp/readonly
    #   toolPrefix: github
    #   category: source-control
    #   categoryDescription: "GitHub repositories, pull requests, issues, and code search"
    #   allowedTools:
    #     - get_file_contents
    #     - get_commit
    #     - list_commits
    #     - list_branches
    #     - search_code
    #     - search_repositories
    #     - pull_request_read
    #     - list_pull_requests
    #     - search_pull_requests
    #     - issue_read
    #     - list_issues
    #     - search_issues
    # - name: github_actions
    #   url: https://api.githubcopilot.com/mcp/x/actions/readonly
    #   toolPrefix: github_actions
    #   category: ci
    #   categoryDescription: "GitHub Actions workflows, runs, jobs, and logs"
    #   allowedTools:
    #     - actions_list
    #     - actions_get
    #     - get_job_logs
    ## GitHub App configuration for token auto-provisioning.
    ## When enabled, sandbox agents receive a `github-token` file secret.
    ## The PEM private key is read from the main drua secret (key: github-app-private-key).
    githubApp:
      enabled: false
      clientId: ""
      installationId: ""
  ## Optional postgres MCP sidecar exposing drua's own database to admins
  ## via MCP Streamable-HTTP at /mcp. Uses bytebase/dbhub (the same image
  ## lana-bank uses) — read-only posture should be enforced at the database
  ## user layer (the DSN it reads must point to a read-only role).
  postgresMcp:
    enabled: false
    image:
      repository: bytebase/dbhub
      tag: 0.21.1
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8000
    ## Source of the postgres DSN (env var DSN). Defaults to the main
    ## galoy-agents secret (key `pg-con`) populated by Terraform from the
    ## GCP postgres module — no extra secret wiring required.
    databaseUrlSecret:
      name: ""
      key: pg-con
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  secrets:
    create: true
    pgCon: ""
    pgMcpUri: ""
    githubClientSecret: ""
    concourseUsername: ""
    concoursePassword: ""
    zendutyApiToken: ""
    anthropicApiKey: ""
    openaiApiKey: ""
    tunnelInternalSecret: ""
    annotations:
  codeAssistant:
    indexHash: "63f26586413c03d57ccf29f1eb17e234c163e09e24a9c99030b3c0bf9fbaf172"
    embedderHash: "569359897109da21014e728cd4d618843766f7f5a52f95c0c35e57250c117d06"
    gcsBucket: galoy-agents-models
    gcsCreds: ""
    initImage: google/cloud-sdk:slim
kubernetes-mcp-server:
  enabled: false
  image:
    registry: ghcr.io
    repository: containers/kubernetes-mcp-server
    version: v0.0.60
  replicaCount: 1
  ingress:
    enabled: false
  service:
    port: 3001
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  metrics:
    serviceMonitor:
      enabled: false
    prometheusRule:
      enabled: false
  extraArgs:
    - "--read-only"
    - "--toolsets=core"
  rbac:
    create: true
    extraClusterRoles:
      - name: readonly
        rules:
          - apiGroups: [""]
            resources: [pods, pods/log, services, events, namespaces, nodes, endpoints, persistentvolumeclaims, replicationcontrollers, configmaps]
            verbs: [get, list, watch]
          - apiGroups: [""]
            resources: [nodes/proxy]
            verbs: [get]
          - apiGroups: [apps]
            resources: [deployments, statefulsets, daemonsets, replicasets]
            verbs: [get, list, watch]
          - apiGroups: [batch]
            resources: [jobs, cronjobs]
            verbs: [get, list, watch]
          - apiGroups: [networking.k8s.io]
            resources: [ingresses, networkpolicies]
            verbs: [get, list, watch]
          - apiGroups: [autoscaling]
            resources: [horizontalpodautoscalers]
            verbs: [get, list, watch]
          - apiGroups: [metrics.k8s.io]
            resources: [pods, nodes]
            verbs: [get, list]
          - apiGroups: [agents.x-k8s.io]
            resources: [sandboxes]
            verbs: [get, list, watch]
    extraClusterRoleBindings:
      - name: readonly
        roleRef:
          name: readonly
  config:
    port: "{{ .Values.service.port }}"
    read_only: true
    toolsets: ["core"]
    denied_resources:
      - group: ""
        version: v1
        kind: Secret
sandbox:
  enabled: false
  ## Namespace where sandbox CRs and pods are created.
  ## Defaults to Release.Namespace if empty.
  namespace: ""
  ## Namespace where the sandbox controller runs.
  ## Defaults to "agent-sandbox-system" if empty.
  controllerNamespace: ""
  ## Whether the Helm chart should create the sandbox namespace.
  ## Set to false when the namespace is managed externally (e.g. Terraform).
  createNamespace: true
  ## Install the Agent Sandbox CRDs + controller from vendored upstream manifests.
  ## Set to false if the controller is already installed (e.g. via Terraform).
  installController: true
  templateName: agent-sandbox
  runtimeClassName: gvisor
  networkPolicyManagement: Managed
  ## MCP gateway URL for sandbox pods (e.g. "http://drua.drua.svc.cluster.local:5254/mcp")
  mcpGatewayUrl: ""
  ## drua git-proxy URL for sandbox pods. When set, the sandbox image's
  ## entrypoint adds an `[url …] insteadOf = https://github.com/`
  ## rewrite + a `drua-sa` credential helper so all `git clone` /
  ## `git push` traffic flows through drua, not directly to github.com.
  ## Pair with `sandbox.saTokenAudience = "galoy-agents-git"` (default).
  ## Required for M5 — without this, the kill-switch NetworkPolicy
  ## leaves the sandbox unable to reach github.com.
  gitProxyUrl: ""
  ## Audience claim for the projected SA token (must match drua's
  ## SaTokenValidator audience). Repurposed from the prior
  ## `galoy-agents-mcp` audience per memo `019dfebc` §3.2 — one token
  ## covers MCP + git-proxy + future SA-authed paths.
  saTokenAudience: "galoy-agents-git"
  image:
    repository: us.gcr.io/galoyorg/sandbox
    digest: ""
    tag: edge
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodePool:
    taintKey: sandbox.gke.io/runtime
    taintValue: gvisor
  nodeSelector:
    sandbox.gke.io/runtime: gvisor
  ## Free-form extra env vars on the sandbox container. NIX_CONFIG
  ## should normally come from `nixSubstituters` below, not here.
  env: []
  ## Namespace of the OTel collector for trace export.
  ## When set, adds an egress rule allowing port 4318 (OTLP HTTP).
  otelCollectorNamespace: ""
  ## Nix substituters placed before cache.nixos.org in the sandbox's
  ## NIX_CONFIG. Point this at a private Cachix or in-cluster nix-serve
  ## so sandbox flakes pull from the local/project cache first.
  nixSubstituters:
    - url: https://galoy-agents.cachix.org
      publicKey: galoy-agents.cachix.org-1:wGb5wYMLJ3yPYoOvf2O5vt9gEZEJ7hHsqDCNPMELGPY=
  ## Optional Nix netrc file for authenticated binary caches, such as a
  ## private Cachix cache. When enabled, `netrc-file = <mountPath>` is added
  ## to sandbox NIX_CONFIG and the Secret is mounted into the sandbox
  ## container. Keep this read-only; do not use a write-capable cache token.
  nixNetrc:
    enabled: false
    mountPath: /etc/nix/netrc
    secret:
      ## Set create=false and name=<existing secret> for externally managed
      ## secrets. The Secret must live in the sandbox namespace.
      create: false
      name: ""
      key: netrc
      ## Used only when create=true.
      ## Example:
      ##   machine lana-bank-github-actions.cachix.org password <read-token>
      contents: ""
  persistence:
    mountPath: /workspace
    size: 10Gi
    storageClassName: standard-rwo
    ## Per-sandbox `/nix` volume. Without this, nix builds inside the
    ## sandbox write to the container's writable layer — bounded under
    ## gVisor and far too small for `nix develop` on lana-bank
    ## (~20 GiB closure). The volume is seeded from the image's baked-in
    ## /nix on first boot and is owned by the sandbox controller.
    nixStore:
      enabled: true
      size: 50Gi
      ## Falls back to `persistence.storageClassName` when empty.
      storageClassName: ""
postgresql:
  enabled: true
  image:
    repository: bitnamilegacy/postgresql
    tag: 14.5.0-debian-11-r35
  auth:
    enablePostgresUser: false
    username: galoy-agents
    password: galoy-agents
    database: galoy-agents
resources: {}
