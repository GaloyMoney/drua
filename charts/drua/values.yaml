fullnameOverride: ""
nameOverride: ""
galoyAgents:
  resources: {}
  tracing:
    serviceName: galoy-agents-dev
    otelExporterOtlpEndpoint: "http://localhost:4317"
  server:
    service:
      type: ClusterIP
      port: 5254
      annotations: {}
  ingress:
    enabled: false
    host: ""
    ingressClassName: ""
    annotations: {}
    tls: []
  labels: {}
  image:
    repository: us.gcr.io/galoyorg/galoy-agents
    digest: "sha256:69a3157b6ad60c04e5514e1c6fcad69cf234fff2a644b42fc3e1f3df24525fcd"
    tag: edge
  replicas: 1
  annotations:
  config:
    server:
      host: "0.0.0.0"
      secureCookies: true
      mcpEndpoint: ""
      tunnel:
        deployments: {}
    oauth:
      githubClientId: ""
      githubRedirectUri: ""
      githubAllowedTeams: []
    ## LLM providers and their models. Each model declares token limits
    ## used for compaction and prompt sizing.
    providers:
      - name: anthropic
        models:
          - name: claude-haiku-4-5-20251001
            maxTokensPerResponse: 4096
            contextWindowTokens: 200000
    ## Per-role defaults applied when an agent with that role is created.
    ## Both `workspaceLead` and `agent` are REQUIRED — the binary refuses
    ## to start if either `agents.builtin_roles.workspace_lead` or
    ## `agents.builtin_roles.agent` is missing.
    agents:
      workspaceLead:
        model: "claude-haiku-4-5-20251001"
        compaction:
          ## When a user message arrives more than this many seconds after
          ## the previous assistant response, start a fresh thread.
          resetTimeDeltaSeconds: 600
        systemPrompt: |
          You are the lead agent of your workspace. You investigate / coordinate
          and delegate. You answer questions, and use the available tools to help the
          user accomplish their goals. Be concise and action-oriented.
      agent:
        model: "claude-haiku-4-5-20251001"
        compaction:
          resetTimeDeltaSeconds: 600
        systemPrompt: |
          You are an agent operating inside a Galoy Agents workspace.
          You work on the tasks assigned to you and, when attached to
          a sandbox, you run commands and edit files inside it. Be
          concise and action-oriented.
    codeAssistant:
      dbPath: "/data/code-assistant/code-assistant.db"
    concourse:
      enabled: false
      url: ""
      team: ""
    ## JS-engine sandbox limits for the `compose` top-level tool. Each
    ## key maps 1:1 to a JsEngine setter; missing keys fall back to the
    ## drua-core defaults (50 calls / 4 MiB per inner tool result /
    ## 100 KiB final return / 8 MiB / 512 KiB / 120 s default / 300 s max).
    ## Byte-valued limits are quoted to keep YAML from auto-promoting them
    ## to float64 — Helm's serializer otherwise renders e.g. 16777216 as
    ## "1.6777216e+07", which Rust serde rejects for usize fields.
    compose:
      maxToolCalls: 50
      ## Per inner-tool-result cap. Scripts may pull large payloads
      ## (logs, manifests) and filter them before returning.
      maxToolResultBytes: "4194304"
      ## Final-return cap. Bounded so the agent context stays clean.
      maxReturnBytes: "102400"
      ## Console buffer cap. Tail-truncated when exceeded — newest lines
      ## kept, oldest dropped. ~1% of agent context at 8 KiB.
      maxConsoleBytes: "8192"
      memoryLimitBytes: "8388608"
      stackLimitBytes: "524288"
      defaultTimeoutMs: 120000
      maxTimeoutMs: 300000
    mcpUpstreams: []
    # - name: honeycomb
    #   url: https://mcp.honeycomb.io/mcp
    #   category: observability
    #   categoryDescription: "Distributed traces, SLOs, and query analysis"
    # - name: github
    #   url: https://api.githubcopilot.com/mcp/readonly
    #   toolPrefix: github
    #   category: source-control
    #   categoryDescription: "GitHub repositories, pull requests, issues, and code search"
    #   allowedTools:
    #     - get_file_contents
    #     - get_commit
    #     - list_commits
    #     - list_branches
    #     - search_code
    #     - search_repositories
    #     - pull_request_read
    #     - list_pull_requests
    #     - search_pull_requests
    #     - issue_read
    #     - list_issues
    #     - search_issues
    # - name: github_actions
    #   url: https://api.githubcopilot.com/mcp/x/actions/readonly
    #   toolPrefix: github_actions
    #   category: ci
    #   categoryDescription: "GitHub Actions workflows, runs, jobs, and logs"
    #   allowedTools:
    #     - actions_list
    #     - actions_get
    #     - get_job_logs
    # - name: lingo
    #   url: https://mcp.lingo.dev/account
    #   authHeaderName: x-api-key
    #   category: localization
    #   categoryDescription: "AI-powered localization engine management and translation"
    ## GitHub App configuration for token auto-provisioning.
    ## When enabled, sandbox agents receive a `github-token` file secret.
    ## The PEM private key is read from the main drua secret (key: github-app-private-key).
    githubApp:
      enabled: false
      clientId: ""
      installationId: ""
  ## Optional postgres MCP sidecar exposing drua's own database to admins
  ## via MCP Streamable-HTTP at /mcp. Uses bytebase/dbhub (the same image
  ## lana-bank uses) — read-only posture should be enforced at the database
  ## user layer (the DSN it reads must point to a read-only role).
  postgresMcp:
    enabled: false
    image:
      repository: bytebase/dbhub
      tag: 0.21.1
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8000
    ## Source of the postgres DSN (env var DSN). Defaults to the main
    ## galoy-agents secret (key `pg-con`) populated by Terraform from the
    ## GCP postgres module — no extra secret wiring required.
    databaseUrlSecret:
      name: ""
      key: pg-con
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  secrets:
    create: true
    pgCon: ""
    pgMcpUri: ""
    githubClientSecret: ""
    concourseUsername: ""
    concoursePassword: ""
    anthropicApiKey: ""
    annotations:
  codeAssistant:
    indexHash: "01afd6e34fa074a5e7622110bfd9cab83d2de6ea39ae9b7dcff6697b0cf30861"
    embedderHash: "569359897109da21014e728cd4d618843766f7f5a52f95c0c35e57250c117d06"
    gcsBucket: galoy-agents-models
    gcsCreds: ""
    initImage: google/cloud-sdk:slim
kubernetes-mcp-server:
  enabled: false
  image:
    registry: ghcr.io
    repository: containers/kubernetes-mcp-server
    version: v0.0.60
  replicaCount: 1
  ingress:
    enabled: false
  service:
    port: 3001
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  metrics:
    serviceMonitor:
      enabled: false
    prometheusRule:
      enabled: false
  extraArgs:
    - "--read-only"
    - "--toolsets=core"
  rbac:
    create: true
    extraClusterRoles:
      - name: readonly
        rules:
          - apiGroups: [""]
            resources: [pods, pods/log, services, events, namespaces, nodes, endpoints, persistentvolumeclaims, replicationcontrollers, configmaps]
            verbs: [get, list, watch]
          - apiGroups: [""]
            resources: [nodes/proxy]
            verbs: [get]
          - apiGroups: [apps]
            resources: [deployments, statefulsets, daemonsets, replicasets]
            verbs: [get, list, watch]
          - apiGroups: [batch]
            resources: [jobs, cronjobs]
            verbs: [get, list, watch]
          - apiGroups: [networking.k8s.io]
            resources: [ingresses, networkpolicies]
            verbs: [get, list, watch]
          - apiGroups: [autoscaling]
            resources: [horizontalpodautoscalers]
            verbs: [get, list, watch]
          - apiGroups: [metrics.k8s.io]
            resources: [pods, nodes]
            verbs: [get, list]
          - apiGroups: [agents.x-k8s.io]
            resources: [sandboxes]
            verbs: [get, list, watch]
    extraClusterRoleBindings:
      - name: readonly
        roleRef:
          name: readonly
  config:
    port: "{{ .Values.service.port }}"
    read_only: true
    toolsets: ["core"]
    denied_resources:
      - group: ""
        version: v1
        kind: Secret
sandbox:
  enabled: false
  ## Namespace where sandbox CRs and pods are created.
  ## Defaults to Release.Namespace if empty.
  namespace: ""
  ## Namespace where the sandbox controller runs.
  ## Defaults to "agent-sandbox-system" if empty.
  controllerNamespace: ""
  ## Whether the Helm chart should create the sandbox namespace.
  ## Set to false when the namespace is managed externally (e.g. Terraform).
  createNamespace: true
  ## Install the Agent Sandbox CRDs + controller from vendored upstream manifests.
  ## Set to false if the controller is already installed (e.g. via Terraform).
  installController: true
  templateName: agent-sandbox
  runtimeClassName: gvisor
  networkPolicyManagement: Managed
  ## MCP gateway URL for sandbox pods (e.g. "http://drua.drua.svc.cluster.local:5254/mcp")
  mcpGatewayUrl: ""
  ## Audience claim for the projected SA token (must match gateway validation)
  saTokenAudience: "galoy-agents-mcp"
  image:
    repository: us.gcr.io/galoyorg/sandbox
    digest: ""
    tag: edge
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodePool:
    taintKey: sandbox.gke.io/runtime
    taintValue: gvisor
  nodeSelector:
    sandbox.gke.io/runtime: gvisor
  env: []
  ## Namespace of the OTel collector for trace export.
  ## When set, adds an egress rule allowing port 4318 (OTLP HTTP).
  otelCollectorNamespace: ""
  anthropicApiKeySecret: ""
  ## Example: Override or supplement nix cache config at runtime
  # env:
  # - name: NIX_CONFIG
  #   value: "extra-substituters = https://galoy-agents.cachix.org\nextra-trusted-public-keys = galoy-agents.cachix.org-1:wGb5wYMLJ3yPYoOvf2O5vt9gEZEJ7hHsqDCNPMELGPY="
  persistence:
    mountPath: /workspace
    size: 10Gi
    storageClassName: standard-rwo
postgresql:
  enabled: true
  image:
    repository: bitnamilegacy/postgresql
    tag: 14.5.0-debian-11-r35
  auth:
    enablePostgresUser: false
    username: galoy-agents
    password: galoy-agents
    database: galoy-agents
resources: {}
