  ## GitHub App configuration for token auto-provisioning.
  ## When enabled, sandbox agents receive a `github-token` file secret.
  githubApp:
    enabled: false
    clientId: ""
    installationId: ""
    ## Name of a pre-existing K8s Secret containing the PEM private key.
    ## The key file is mounted read-only into the server pod.
    privateKeySecret: ""
    privateKeySecretKey: "private-key.pem"
  secrets:
    create: true
    pgCon: ""
    githubClientSecret: ""
    concourseUsername: ""
    concoursePassword: ""
    anthropicApiKey: ""
    annotations:
  codeAssistant:
    indexHash: "770b5f73239ddd30f3ab5b31e9c21f463ea4755cfadac16edf12aa89182511cd"
    embedderHash: "569359897109da21014e728cd4d618843766f7f5a52f95c0c35e57250c117d06"
    gcsBucket: galoy-agents-models
    gcsCreds: ""
    initImage: google/cloud-sdk:slim
kubernetes-mcp-server:
  enabled: false
  image:
    registry: ghcr.io
    repository: containers/kubernetes-mcp-server
    version: v0.0.60
  replicaCount: 1
  ingress:
    enabled: false
  service:
    port: 3001
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  metrics:
    serviceMonitor:
      enabled: false
    prometheusRule:
      enabled: false
  extraArgs:
    - "--read-only"
    - "--toolsets=core"
  rbac:
    create: true
    extraClusterRoles:
      - name: readonly
        rules:
          - apiGroups: [""]
            resources: [pods, pods/log, services, events, namespaces, nodes, endpoints, persistentvolumeclaims, replicationcontrollers]
            verbs: [get, list, watch]
          - apiGroups: [""]
            resources: [nodes/proxy]
            verbs: [get]
          - apiGroups: [apps]
            resources: [deployments, statefulsets, daemonsets, replicasets]
            verbs: [get, list, watch]
          - apiGroups: [batch]
            resources: [jobs, cronjobs]
            verbs: [get, list, watch]
          - apiGroups: [networking.k8s.io]
            resources: [ingresses, networkpolicies]
            verbs: [get, list, watch]
          - apiGroups: [autoscaling]
            resources: [horizontalpodautoscalers]
            verbs: [get, list, watch]
          - apiGroups: [metrics.k8s.io]
            resources: [pods, nodes]
            verbs: [get, list]
          - apiGroups: [agents.x-k8s.io]
            resources: [sandboxes]
            verbs: [get, list, watch]
    extraClusterRoleBindings:
      - name: readonly
        roleRef:
          name: readonly
  config:
    port: "{{ .Values.service.port }}"
    read_only: true
    toolsets: ["core"]
    denied_resources:
      - group: ""
        version: v1
        kind: Secret
sandbox:
  enabled: false
  ## Namespace where sandbox CRs and pods are created.
  ## Defaults to Release.Namespace if empty.
  namespace: ""
  ## Namespace where the sandbox controller runs.
  ## Defaults to "agent-sandbox-system" if empty.
  controllerNamespace: ""
  ## Whether the Helm chart should create the sandbox namespace.
  ## Set to false when the namespace is managed externally (e.g. Terraform).
  createNamespace: true
  ## Install the Agent Sandbox CRDs + controller from vendored upstream manifests.
  ## Set to false if the controller is already installed (e.g. via Terraform).
  installController: true
  templateName: agent-sandbox
  runtimeClassName: gvisor
  networkPolicyManagement: Managed
  ## MCP gateway URL for sandbox pods (e.g. "http://galoy-agents.galoy-agents.svc.cluster.local:5254/mcp")
  mcpGatewayUrl: ""
  ## Audience claim for the projected SA token (must match gateway validation)
  saTokenAudience: "galoy-agents-mcp"
  image:
    repository: us.gcr.io/galoyorg/sandbox-base
    digest: ""
    tag: edge
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodePool:
    taintKey: sandbox.gke.io/runtime
    taintValue: gvisor
  nodeSelector:
    sandbox.gke.io/runtime: gvisor
  env: []
  ## Namespace of the OTel collector for trace export.
  ## When set, adds an egress rule allowing port 4318 (OTLP HTTP).
  otelCollectorNamespace: ""
  anthropicApiKeySecret: ""
  ## Example: Override or supplement nix cache config at runtime
  # env:
  # - name: NIX_CONFIG
  #   value: "extra-substituters = https://galoy-agents.cachix.org\nextra-trusted-public-keys = galoy-agents.cachix.org-1:wGb5wYMLJ3yPYoOvf2O5vt9gEZEJ7hHsqDCNPMELGPY="
  persistence:
    mountPath: /workspace
    size: 10Gi
    storageClassName: standard-rwo
postgresql:
  enabled: true
  image:
    repository: bitnamilegacy/postgresql
    tag: 14.5.0-debian-11-r35
  auth:
    enablePostgresUser: false
    username: galoy-agents
    password: galoy-agents
    database: galoy-agents
resources: {}
