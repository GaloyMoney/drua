sandbox:
  enabled: false
  ## Namespace where sandbox CRs and pods are created.
  ## Defaults to Release.Namespace if empty.
  namespace: ""
  ## Namespace where the sandbox controller runs.
  ## Defaults to "agent-sandbox-system" if empty.
  controllerNamespace: ""
  ## Whether the Helm chart should create the sandbox namespace.
  ## Set to false when the namespace is managed externally (e.g. Terraform).
  createNamespace: true
  ## Install the Agent Sandbox CRDs + controller from vendored upstream manifests.
  ## Set to false if the controller is already installed (e.g. via Terraform).
  installController: true
  templateName: agent-sandbox
  runtimeClassName: gvisor
  automountServiceAccountToken: false
  networkPolicyManagement: Managed
  image:
    repository: us.gcr.io/galoyorg/sandbox-base
    digest: ""
    tag: edge
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  nodePool:
    taintKey: sandbox.gke.io/runtime
    taintValue: gvisor
  nodeSelector:
    sandbox.gke.io/runtime: gvisor
  env: []
  ## Example: Override or supplement nix cache config at runtime
  # env:
  # - name: NIX_CONFIG
  #   value: "extra-substituters = https://galoy-agents.cachix.org\nextra-trusted-public-keys = galoy-agents.cachix.org-1:wGb5wYMLJ3yPYoOvf2O5vt9gEZEJ7hHsqDCNPMELGPY="
  persistence:
    enabled: false
    mountPath: /workspace
    size: 10Gi
    storageClassName: standard-rwo
  warmPool:
    enabled: true
    minReady: 2
postgresql:
  enabled: true
  image:
    repository: bitnamilegacy/postgresql
    tag: 14.5.0-debian-11-r35
  auth:
    enablePostgresUser: false
    username: galoy-agents
    password: galoy-agents
    database: galoy-agents
resources: {}
