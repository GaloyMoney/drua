apiVersion: v2
name: galoy-agents
description: Helm chart for deploying GaloyMoney/galoy-agents
type: application
version: 0.1.0-dev
appVersion: "0.1.0"
dependencies:
  - name: postgresql
    version: 16.4.13
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: kubernetes-mcp-server
    version: 0.1.0
    repository: file://charts/kubernetes-mcp-server
    condition: kubernetes-mcp-server.enabled
