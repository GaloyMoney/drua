apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "galoyAgents.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
data:
  galoy-agents.yml: |-
    server:
      port: {{ .Values.galoyAgents.server.service.port }}
      host: {{ .Values.galoyAgents.config.server.host | quote }}
      secure_cookies: {{ .Values.galoyAgents.config.server.secureCookies }}
      mcp_endpoint: {{ .Values.galoyAgents.config.server.mcpEndpoint | quote }}
    oauth:
      github_client_id: {{ .Values.galoyAgents.config.oauth.githubClientId | quote }}
      github_redirect_uri: {{ .Values.galoyAgents.config.oauth.githubRedirectUri | quote }}
    {{- if .Values.galoyAgents.config.oauth.githubAllowedTeams }}
      github_allowed_teams:
      {{- range .Values.galoyAgents.config.oauth.githubAllowedTeams }}
        - {{ . | quote }}
      {{- end }}
    {{- end }}
    toolsets:
      report:
        enabled: {{ .Values.galoyAgents.config.report.enabled }}
      code_assistant:
        db_path: {{ .Values.galoyAgents.config.codeAssistant.dbPath | quote }}
      concourse:
        enabled: {{ .Values.galoyAgents.config.concourse.enabled }}
        url: {{ .Values.galoyAgents.config.concourse.url | quote }}
        team: {{ .Values.galoyAgents.config.concourse.team | quote }}
      {{- if or .Values.galoyAgents.config.mcpUpstreams (and .Values.kubernetesMcpServer .Values.kubernetesMcpServer.enabled) }}
      mcp_upstreams:
      {{- range .Values.galoyAgents.config.mcpUpstreams }}
        - name: {{ .name | quote }}
          url: {{ .url | quote }}
          {{- if .authHeaderName }}
          auth_header_name: {{ .authHeaderName | quote }}
          {{- end }}
          {{- if .category }}
          category: {{ .category | quote }}
          {{- end }}
          {{- if .categoryDescription }}
          category_description: {{ .categoryDescription | quote }}
          {{- end }}
          {{- if .toolPrefix }}
          tool_prefix: {{ .toolPrefix | quote }}
          {{- end }}
          {{- if .allowedTools }}
          allowed_tools:
          {{- range .allowedTools }}
            - {{ . | quote }}
          {{- end }}
          {{- end }}
          {{- if .requiredScopes }}
          required_scopes:
          {{- range .requiredScopes }}
            - {{ . | quote }}
          {{- end }}
          {{- end }}
      {{- end }}
      {{- if and .Values.kubernetesMcpServer .Values.kubernetesMcpServer.enabled }}
        - name: "kubernetes"
          url: "http://{{ template "galoyAgents.fullname" . }}-k8s-mcp:{{ .Values.kubernetesMcpServer.service.port }}/mcp"
          tool_prefix: "k8s"
          category: "infrastructure"
          category_description: "Kubernetes cluster operations — pods, logs, events, deployments"
          required_scopes:
            - "admin"
          allowed_tools:
            - "events_list"
            - "namespaces_list"
            - "nodes_top"
            - "nodes_stats_summary"
            - "pods_list"
            - "pods_list_in_namespace"
            - "pods_get"
            - "pods_top"
            - "pods_log"
            - "resources_list"
            - "resources_get"
      {{- end }}
      {{- end }}
    sandbox:
      enabled: {{ .Values.sandbox.enabled }}
      namespace: {{ include "galoyAgents.sandboxNamespace" . | quote }}
      template_name: {{ .Values.sandbox.templateName | quote }}
      persistence:
        size: {{ .Values.sandbox.persistence.size | quote }}
        storage_class: {{ .Values.sandbox.persistence.storageClassName | quote }}
        mount_path: {{ .Values.sandbox.persistence.mountPath | quote }}
