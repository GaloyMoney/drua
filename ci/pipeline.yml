#@ load("@ytt:data", "data")
#@ load("fragments.lib.yml",
#@   "nix_flake_cachix_image_config",
#@ )

groups:
- name: galoy-agents-bin
  jobs:
  - check-code
  - test-bats
  - build-edge-image
  - deploy-to-prod
  - train-classifier
  - build-code-assistant-index
- name: sandbox-base
  jobs:
  - test-harness
  - build-sandbox-base-image

jobs:
- name: check-code
  serial: true
  plan:
  - get: repo
    trigger: true
  - task: nix-flake-check
    config:
      platform: linux
      image_resource: #@ nix_flake_cachix_image_config()
      inputs:
      - name: repo
      params:
        CACHIX_AUTH_TOKEN: #@ data.values.cachix_auth_token
        CACHIX_CACHE_NAME: #@ data.values.cachix_cache_name
      run:
        path: sh
        args:
          - -exc
          - |
            set -euo pipefail
            cd repo
            cachix use $CACHIX_CACHE_NAME
            cachix watch-exec $CACHIX_CACHE_NAME -- nix flake check

- name: test-bats
  serial: true
  plan:
  - get: repo
    trigger: true
  - task: bats-e2e
    privileged: true
    attempts: 2
    config:
      platform: linux
      image_resource: #@ nix_flake_cachix_image_config()
      inputs:
      - name: repo
      params:
        CACHIX_AUTH_TOKEN: #@ data.values.cachix_auth_token
        CACHIX_CACHE_NAME: #@ data.values.cachix_cache_name
      run:
        path: sh
        args:
          - -exc
          - |
            set -euo pipefail
            cd repo
            cachix use $CACHIX_CACHE_NAME
            cachix watch-exec $CACHIX_CACHE_NAME -- nix run .#bats

- name: build-edge-image
  serial: true
  plan:
  - get: repo
    trigger: true
    passed: [check-code, test-bats]
  - task: build-image
    config:
      platform: linux
      image_resource: #@ nix_flake_cachix_image_config()
      inputs:
      - name: repo
      outputs:
      - name: image
      params:
        CACHIX_AUTH_TOKEN: #@ data.values.cachix_auth_token
        CACHIX_CACHE_NAME: #@ data.values.cachix_cache_name
      run:
        path: sh
        args:
          - -exc
          - |
            set -euo pipefail
            cd repo
            cachix use $CACHIX_CACHE_NAME
            cachix watch-exec $CACHIX_CACHE_NAME -- nix build .#docker-image
            gunzip -c result > ../image/image.tar
  - put: edge-image
    params:
      image: image/image.tar
    get_params:
      skip_download: true

- name: deploy-to-prod
  serial: true
  plan:
  - in_parallel:
    - get: deploy-config
      trigger: true
    - get: edge-image
      trigger: true
      passed: [build-edge-image]
      params:
        skip_download: true
    - get: sandbox-base-edge-image
      trigger: true
      passed: [build-sandbox-base-image]
      params:
        skip_download: true
  - task: prepare-deployment
    config:
      platform: linux
      image_resource: #@ nix_flake_cachix_image_config()
      inputs:
      - name: deploy-config
        path: repo
      - name: edge-image
      - name: sandbox-base-edge-image
      outputs:
      - name: deployment
      params:
        GITHUB_CLIENT_SECRET: #@ data.values.deploy_github_client_secret
        GCS_CREDS_JSON: #@ data.values.gcs_creds_json
        CONCOURSE_USERNAME: #@ data.values.deploy_concourse_username
        CONCOURSE_PASSWORD: #@ data.values.deploy_concourse_password
        HONEYCOMB_API_KEY: #@ data.values.honeycomb_api_key
        GITHUB_PAT: #@ data.values.github_pat
        LINGO_API_KEY: #@ data.values.lingo_api_key
        ANTHROPIC_API_KEY: #@ data.values.deploy_anthropic_api_key
      run:
        path: sh
        args:
          - -ec
          - |
            set -euo pipefail

            DIGEST=$(cat edge-image/digest)
            SANDBOX_BASE_DIGEST=$(cat sandbox-base-edge-image/digest)

            cp -r repo/ci/deploy/galoy-agents deployment/tf
            cp -r repo/charts/galoy-agents deployment/tf/chart

            set +x
            cat <<EOF > deployment/tf/terraform.tfvars
            image_digest = "${DIGEST}"
            sandbox_base_image_digest = "${SANDBOX_BASE_DIGEST}"
            github_client_secret = "${GITHUB_CLIENT_SECRET}"
            concourse_username = "${CONCOURSE_USERNAME}"
            concourse_password = "${CONCOURSE_PASSWORD}"
            honeycomb_api_key = "${HONEYCOMB_API_KEY}"
            github_pat = "${GITHUB_PAT}"
            lingo_api_key = "${LINGO_API_KEY}"
            anthropic_api_key = "${ANTHROPIC_API_KEY}"
            EOF

            printf '%s' "$GCS_CREDS_JSON" > deployment/tf/gcs-creds.json
            set -x
            echo "Deployment files prepared"
  - put: tf-galoy-agents-prod
    tags: [galoy-agents]
    params:
      env_name: prod
      vars_files: [deployment/tf/terraform.tfvars]
      terraform_source: deployment/tf

- name: train-classifier
  serial: true
  plan:
  - in_parallel:
    - get: repo-labels
      trigger: true
    - get: repo
  - task: train-and-export
    config:
      platform: linux
      image_resource: #@ nix_flake_cachix_image_config()
      inputs:
      - name: repo
      outputs:
      - name: model
      params:
        CACHIX_AUTH_TOKEN: #@ data.values.cachix_auth_token
        CACHIX_CACHE_NAME: #@ data.values.cachix_cache_name
      run:
        path: sh
        args:
          - -exc
          - |
            set -euo pipefail
            cachix use $CACHIX_CACHE_NAME

            cd repo
            cachix watch-exec $CACHIX_CACHE_NAME -- nix run ./ci#train-classifier -- "$(pwd)/../model"
  - put: code-assistant-model
    params:
      file: model/*.tar.gz

- name: build-code-assistant-index
  serial: true
  plan:
  - in_parallel:
    - get: nightly
      trigger: true
    - get: repo
    - get: cala-repo
    - get: lana-repo
    - get: job-repo
    - get: obix-repo
    - get: code-assistant-model
      trigger: true
      passed: [train-classifier]
  - task: build-index
    config:
      platform: linux
      image_resource: #@ nix_flake_cachix_image_config()
      inputs:
      - name: repo
      - name: cala-repo
      - name: lana-repo
      - name: job-repo
      - name: obix-repo
      - name: code-assistant-model
      outputs:
      - name: index
      - name: embedder
      params:
        CACHIX_AUTH_TOKEN: #@ data.values.cachix_auth_token
        CACHIX_CACHE_NAME: #@ data.values.cachix_cache_name
      run:
        path: sh
        args:
          - -exc
          - |
            set -euo pipefail
            cachix use $CACHIX_CACHE_NAME

            mkdir -p /tmp/repos
            ln -s "$(pwd)/cala-repo" /tmp/repos/cala
            ln -s "$(pwd)/lana-repo" /tmp/repos/lana-bank
            ln -s "$(pwd)/job-repo" /tmp/repos/job
            ln -s "$(pwd)/obix-repo" /tmp/repos/obix
            ln -s "$(pwd)/repo" /tmp/repos/galoy-agents

            cd repo
            cachix watch-exec $CACHIX_CACHE_NAME -- \
              nix run ./ci#build-code-assistant-index -- /tmp/repos "$(pwd)/../index" "$(pwd)/../embedder" "$(pwd)/../code-assistant-model"
  - put: code-assistant-index
    params:
      file: index/*.tar.gz
  - put: code-assistant-embedder
    params:
      file: embedder/*.tar.gz
  - task: commit-index-hash
    config:
      platform: linux
      image_resource: #@ nix_flake_cachix_image_config()
      inputs:
      - name: repo
      - name: index
      - name: embedder
      outputs:
      - name: repo-updated
      params:
        CACHIX_AUTH_TOKEN: #@ data.values.cachix_auth_token
        CACHIX_CACHE_NAME: #@ data.values.cachix_cache_name
      run:
        path: sh
        args:
          - -exc
          - |
            set -euo pipefail
            cachix use $CACHIX_CACHE_NAME

            INDEX_HASH=$(basename "$(ls index/*.tar.gz)" .tar.gz)
            EMBEDDER_HASH=$(basename "$(ls embedder/*.tar.gz)" .tar.gz)

            cp -a repo/. repo-updated/
            cd repo-updated
            cachix watch-exec $CACHIX_CACHE_NAME -- \
              nix run ./ci#commit-hash -- "$(pwd)" \
                charts/galoy-agents/values.yaml \
                "galoyAgents.codeAssistant.indexHash" \
                "$INDEX_HASH"
            cachix watch-exec $CACHIX_CACHE_NAME -- \
              nix run ./ci#commit-hash -- "$(pwd)" \
                charts/galoy-agents/values.yaml \
                "galoyAgents.codeAssistant.embedderHash" \
                "$EMBEDDER_HASH"
  - put: repo-chart-values
    params:
      repository: repo-updated
      rebase: true

- name: test-harness
  serial: true
  plan:
  - get: repo-sandbox-image
    trigger: true
  - task: harness-integration-test
    config:
      platform: linux
      image_resource: #@ nix_flake_cachix_image_config()
      inputs:
      - name: repo-sandbox-image
        path: repo
      params:
        CACHIX_AUTH_TOKEN: #@ data.values.cachix_auth_token
        CACHIX_CACHE_NAME: #@ data.values.cachix_cache_name
        ANTHROPIC_API_KEY: #@ data.values.deploy_anthropic_api_key
      run:
        path: sh
        args:
          - -exc
          - |
            set -euo pipefail
            cd repo
            cachix use $CACHIX_CACHE_NAME

            # Claude Code CLI refuses --dangerously-skip-permissions as root.
            # Drop to a non-root user for the actual test run.
            useradd -m testuser
            chown -R testuser: .
            su testuser -c "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY cachix watch-exec $CACHIX_CACHE_NAME -- nix run .#harness-bats"

- name: build-sandbox-base-image
  serial: true
  plan:
  - get: repo-sandbox-image
    trigger: true
    passed: [test-harness]
  - task: build-image
    config:
      platform: linux
      image_resource: #@ nix_flake_cachix_image_config()
      inputs:
      - name: repo-sandbox-image
        path: repo
      outputs:
      - name: image
      params:
        CACHIX_AUTH_TOKEN: #@ data.values.cachix_auth_token
        CACHIX_CACHE_NAME: #@ data.values.cachix_cache_name
      run:
        path: sh
        args:
          - -exc
          - |
            set -euo pipefail
            cd repo
            cachix use $CACHIX_CACHE_NAME
            cachix watch-exec $CACHIX_CACHE_NAME -- nix build .#sandbox-base-image
            gunzip -c result > ../image/image.tar
  - put: sandbox-base-edge-image
    params:
      image: image/image.tar
    get_params:
      skip_download: true

resource_types:
- name: terraform
  type: registry-image
  source:
    repository: #@ data.values.gar_registry + "/terraform-resource"
    tag: latest
    username: #@ data.values.gar_registry_user
    password: #@ data.values.gar_registry_password

- name: gcs-resource
  type: registry-image
  source:
    repository: frodenas/gcs-resource

resources:
#@ repo_source = {
#@   "uri": data.values.git_uri,
#@   "branch": data.values.git_branch,
#@   "private_key": data.values.github_private_key,
#@ }

- name: repo
  type: git
  source:
    uri: #@ data.values.git_uri
    branch: #@ data.values.git_branch
    private_key: #@ data.values.github_private_key
    ignore_paths:
    - ci/pipeline.yml
    - ci/values.yml
    - ci/repipe
    - ci/fragments.lib.yml
    - charts/galoy-agents/values.yaml
    - code-assistant/labels/*
  webhook_token: ((webhook.secret))

- name: repo-sandbox-image
  type: git
  source:
    uri: #@ data.values.git_uri
    branch: #@ data.values.git_branch
    private_key: #@ data.values.github_private_key
    paths:
    - images/sandbox-base/
    - bats/harness.bats
    - bats/harness-helpers.bash

- name: repo-labels
  type: git
  source:
    uri: #@ data.values.git_uri
    branch: #@ data.values.git_branch
    private_key: #@ data.values.github_private_key
    paths:
    - code-assistant/labels/

- name: repo-chart-values
  type: git
  source:
    uri: #@ data.values.git_uri
    branch: #@ data.values.git_branch
    private_key: #@ data.values.github_private_key

- name: deploy-config
  type: git
  source:
    uri: #@ data.values.git_uri
    branch: #@ data.values.git_branch
    private_key: #@ data.values.github_private_key
    paths:
    - charts/galoy-agents/
    - ci/deploy/

- name: cala-repo
  type: git
  source:
    uri: #@ data.values.cala_git_uri
    branch: main
    private_key: #@ data.values.github_private_key

- name: lana-repo
  type: git
  source:
    uri: #@ data.values.lana_git_uri
    branch: main
    private_key: #@ data.values.github_private_key

- name: job-repo
  type: git
  source:
    uri: #@ data.values.job_git_uri
    branch: main
    private_key: #@ data.values.github_private_key

- name: obix-repo
  type: git
  source:
    uri: #@ data.values.obix_git_uri
    branch: main
    private_key: #@ data.values.github_private_key

- name: edge-image
  type: registry-image
  source:
    tag: edge
    username: #@ data.values.gar_registry_user
    password: #@ data.values.gar_registry_password
    repository: #@ data.values.gar_registry + "/" + data.values.folder_registry_image

- name: sandbox-base-edge-image
  type: registry-image
  source:
    tag: edge
    username: #@ data.values.gar_registry_user
    password: #@ data.values.gar_registry_password
    repository: #@ data.values.gar_registry + "/sandbox-base"

- name: tf-galoy-agents-prod
  type: terraform
  source:
    backend_type: gcs
    backend_config:
      bucket: #@ data.values.deploy_tf_state_bucket
      prefix: galoy-agents/prod
      credentials: #@ data.values.deploy_gcp_creds_json
    env:
      GOOGLE_CREDENTIALS: #@ data.values.deploy_gcp_creds_json

- name: code-assistant-index
  type: gcs-resource
  source:
    bucket: #@ data.values.code_assistant_gcs_bucket
    json_key: #@ data.values.gcs_creds_json
    regexp: index/(.*).tar.gz

- name: code-assistant-model
  type: gcs-resource
  source:
    bucket: #@ data.values.code_assistant_gcs_bucket
    json_key: #@ data.values.gcs_creds_json
    regexp: model/(.*).tar.gz

- name: code-assistant-embedder
  type: gcs-resource
  source:
    bucket: #@ data.values.code_assistant_gcs_bucket
    json_key: #@ data.values.gcs_creds_json
    regexp: embedder/(.*).tar.gz

- name: nightly
  type: time
  source:
    start: "04:00"
    stop: "04:30"
    location: UTC
