#@ load("@ytt:data", "data")
#@ load("fragments.lib.yml",
#@   "nix_flake_image_config",
#@ )

groups:
- name: drua
  jobs:
  - check-code
  - test-integration
  - test-bats
  - test-sandbox
  - build-edge-image
  - build-sandbox-image
  - deploy-to-prod
  - train-classifier
  - build-code-assistant-index

jobs:
- name: check-code
  serial: true
  plan:
  - get: repo
    trigger: true
  - task: nix-flake-check
    config:
      platform: linux
      image_resource: #@ nix_flake_image_config()
      inputs:
      - name: repo
      caches:
      - path: /nix-cache
      run:
        path: repo/ci/tasks/with-nix-cache.sh
        args:
          - sh
          - -exc
          - |
            cd repo
            nix flake check

- name: test-integration
  serial: true
  plan:
  - get: repo
    trigger: true
  - task: integration-tests
    privileged: true
    config:
      platform: linux
      image_resource: #@ nix_flake_image_config()
      inputs:
      - name: repo
      caches:
      - path: /nix-cache
      run:
        path: repo/ci/tasks/with-nix-cache.sh
        args:
          - sh
          - -exc
          - |
            cd repo
            nix run .#integration-tests

- name: test-bats
  serial: true
  plan:
  - get: repo
    trigger: true
  - task: bats-e2e
    privileged: true
    config:
      platform: linux
      image_resource: #@ nix_flake_image_config()
      inputs:
      - name: repo
      caches:
      - path: /nix-cache
      run:
        path: repo/ci/tasks/with-nix-cache.sh
        args:
          - sh
          - -exc
          - |
            cd repo
            nix run .#bats

- name: build-edge-image
  serial: true
  plan:
  - get: repo
    trigger: true
    passed: [check-code, test-integration, test-bats]
  - task: build-image
    config:
      platform: linux
      image_resource: #@ nix_flake_image_config()
      inputs:
      - name: repo
      outputs:
      - name: image
      caches:
      - path: /nix-cache
      run:
        path: repo/ci/tasks/with-nix-cache.sh
        args:
          - sh
          - -exc
          - |
            cd repo
            nix build .#docker-image
            gunzip -c result > ../image/image.tar
  - put: edge-image
    params:
      image: image/image.tar
    get_params:
      skip_download: true

- name: deploy-to-prod
  serial: true
  plan:
  - in_parallel:
    - get: deploy-config
      trigger: true
    - get: edge-image
      trigger: true
      passed: [build-edge-image]
      params:
        skip_download: true
    - get: sandbox-edge-image
      trigger: true
      passed: [build-sandbox-image]
      params:
        skip_download: true
  - task: prepare-deployment
    config:
      platform: linux
      image_resource: #@ nix_flake_image_config()
      inputs:
      - name: deploy-config
        path: repo
      - name: edge-image
      - name: sandbox-edge-image
      outputs:
      - name: deployment
      params:
        GITHUB_CLIENT_SECRET: #@ data.values.deploy_github_client_secret
        GCS_CREDS_JSON: #@ data.values.gcs_creds_json
        CONCOURSE_USERNAME: #@ data.values.deploy_concourse_username
        CONCOURSE_PASSWORD: #@ data.values.deploy_concourse_password
        HONEYCOMB_API_KEY: #@ data.values.honeycomb_api_key
        GITHUB_PAT: #@ data.values.github_pat
        LINGO_API_KEY: #@ data.values.lingo_api_key
        ANTHROPIC_API_KEY: #@ data.values.deploy_anthropic_api_key
        GITHUB_APP_PRIVATE_KEY: #@ data.values.deploy_github_app_private_key
      run:
        path: sh
        args:
          - -ec
          - |
            set -euo pipefail

            DIGEST=$(cat edge-image/digest)
            SANDBOX_DIGEST=$(cat sandbox-edge-image/digest)

            cp -r repo/ci/deploy/drua deployment/tf
            cp -r repo/charts/drua deployment/tf/chart

            set +x
            cat <<EOF > deployment/tf/terraform.tfvars
            image_digest = "${DIGEST}"
            sandbox_image_digest = "${SANDBOX_DIGEST}"
            github_client_secret = "${GITHUB_CLIENT_SECRET}"
            concourse_username = "${CONCOURSE_USERNAME}"
            concourse_password = "${CONCOURSE_PASSWORD}"
            honeycomb_api_key = "${HONEYCOMB_API_KEY}"
            github_pat = "${GITHUB_PAT}"
            lingo_api_key = "${LINGO_API_KEY}"
            anthropic_api_key = "${ANTHROPIC_API_KEY}"
            EOF

            printf '%s' "$GCS_CREDS_JSON" > deployment/tf/gcs-creds.json
            printf '%s' "$GITHUB_APP_PRIVATE_KEY" | base64 -d > deployment/tf/github-app-private-key.pem
            set -x
            echo "Deployment files prepared"
  - put: tf-drua-prod
    tags: [drua]
    params:
      env_name: prod
      vars_files: [deployment/tf/terraform.tfvars]
      terraform_source: deployment/tf

- name: train-classifier
  serial: true
  plan:
  - in_parallel:
    - get: repo-labels
      trigger: true
    - get: repo
  - task: train-and-export
    config:
      platform: linux
      image_resource: #@ nix_flake_image_config()
      inputs:
      - name: repo
      outputs:
      - name: model
      caches:
      - path: /nix-cache
      run:
        path: repo/ci/tasks/with-nix-cache.sh
        args:
          - sh
          - -exc
          - |
            cd repo
            nix run ./ci#train-classifier -- "$(pwd)/../model"
  - put: code-assistant-model
    params:
      file: model/*.tar.gz

- name: build-code-assistant-index
  serial: true
  plan:
  - in_parallel:
    - get: nightly
      trigger: true
    - get: repo
    - get: cala-repo
    - get: lana-repo
    - get: job-repo
    - get: obix-repo
    - get: code-assistant-model
      trigger: true
      passed: [train-classifier]
  - task: build-index
    config:
      platform: linux
      image_resource: #@ nix_flake_image_config()
      inputs:
      - name: repo
      - name: cala-repo
      - name: lana-repo
      - name: job-repo
      - name: obix-repo
      - name: code-assistant-model
      outputs:
      - name: index
      - name: embedder
      caches:
      - path: /nix-cache
      run:
        path: repo/ci/tasks/with-nix-cache.sh
        args:
          - sh
          - -exc
          - |
            mkdir -p /tmp/repos
            ln -s "$(pwd)/cala-repo" /tmp/repos/cala
            ln -s "$(pwd)/lana-repo" /tmp/repos/lana-bank
            ln -s "$(pwd)/job-repo" /tmp/repos/job
            ln -s "$(pwd)/obix-repo" /tmp/repos/obix
            ln -s "$(pwd)/repo" /tmp/repos/drua

            cd repo
            nix run ./ci#build-code-assistant-index -- /tmp/repos "$(pwd)/../index" "$(pwd)/../embedder" "$(pwd)/../code-assistant-model"
  - put: code-assistant-index
    params:
      file: index/*.tar.gz
  - put: code-assistant-embedder
    params:
      file: embedder/*.tar.gz
  - task: commit-index-hash
    config:
      platform: linux
      image_resource: #@ nix_flake_image_config()
      inputs:
      - name: repo
      - name: index
      - name: embedder
      outputs:
      - name: repo-updated
      caches:
      - path: /nix-cache
      run:
        path: repo/ci/tasks/with-nix-cache.sh
        args:
          - sh
          - -exc
          - |
            INDEX_HASH=$(basename "$(ls index/*.tar.gz)" .tar.gz)
            EMBEDDER_HASH=$(basename "$(ls embedder/*.tar.gz)" .tar.gz)

            cp -a repo/. repo-updated/
            cd repo-updated
            nix run ./ci#commit-hash -- "$(pwd)" \
              charts/drua/values.yaml \
              "galoyAgents.codeAssistant.indexHash" \
              "$INDEX_HASH"
            nix run ./ci#commit-hash -- "$(pwd)" \
              charts/drua/values.yaml \
              "galoyAgents.codeAssistant.embedderHash" \
              "$EMBEDDER_HASH"
  - put: repo-chart-values
    params:
      repository: repo-updated
      rebase: true

- name: test-sandbox
  serial: true
  plan:
  - get: repo-sandbox
    trigger: true
  - task: sandbox-integration-test
    config:
      platform: linux
      image_resource: #@ nix_flake_image_config()
      inputs:
      - name: repo-sandbox
        path: repo
      caches:
      - path: /nix-cache
      run:
        path: repo/ci/tasks/with-nix-cache.sh
        args:
          - sh
          - -exc
          - |
            cd repo
            nix run .#sandbox-bats

- name: build-sandbox-image
  serial: true
  plan:
  - get: repo-sandbox
    trigger: true
    passed: [test-sandbox]
  - task: build-image
    config:
      platform: linux
      image_resource: #@ nix_flake_image_config()
      inputs:
      - name: repo-sandbox
        path: repo
      outputs:
      - name: image
      caches:
      - path: /nix-cache
      run:
        path: repo/ci/tasks/with-nix-cache.sh
        args:
          - sh
          - -exc
          - |
            cd repo
            nix build .#sandbox-image
            gunzip -c result > ../image/image.tar
  - put: sandbox-edge-image
    params:
      image: image/image.tar
    get_params:
      skip_download: true

resource_types:
- name: terraform
  type: registry-image
  source:
    repository: #@ data.values.gar_registry + "/terraform-resource"
    tag: latest
    username: #@ data.values.gar_registry_user
    password: #@ data.values.gar_registry_password

- name: gcs-resource
  type: registry-image
  source:
    repository: frodenas/gcs-resource

resources:
- name: repo
  type: git
  source:
    uri: #@ data.values.git_uri
    branch: #@ data.values.git_branch
    private_key: #@ data.values.github_private_key
    ignore_paths:
    - ci/pipeline.yml
    - ci/values.yml
    - ci/repipe
    - ci/fragments.lib.yml
    - charts/drua/values.yaml
    - code-assistant/labels/*
  webhook_token: ((webhook.secret))

- name: repo-sandbox
  type: git
  source:
    uri: #@ data.values.git_uri
    branch: #@ data.values.git_branch
    private_key: #@ data.values.github_private_key
    paths:
    - images/sandbox/
    - bats/sandbox.bats
    - bats/sandbox-helpers.bash
    - flake.nix

- name: repo-labels
  type: git
  source:
    uri: #@ data.values.git_uri
    branch: #@ data.values.git_branch
    private_key: #@ data.values.github_private_key
    paths:
    - code-assistant/labels/

- name: repo-chart-values
  type: git
  source:
    uri: #@ data.values.git_uri
    branch: #@ data.values.git_branch
    private_key: #@ data.values.github_private_key

- name: deploy-config
  type: git
  source:
    uri: #@ data.values.git_uri
    branch: #@ data.values.git_branch
    private_key: #@ data.values.github_private_key
    paths:
    - charts/drua/
    - ci/deploy/

- name: cala-repo
  type: git
  source:
    uri: #@ data.values.cala_git_uri
    branch: main
    private_key: #@ data.values.github_private_key

- name: lana-repo
  type: git
  source:
    uri: #@ data.values.lana_git_uri
    branch: main
    private_key: #@ data.values.github_private_key

- name: job-repo
  type: git
  source:
    uri: #@ data.values.job_git_uri
    branch: main
    private_key: #@ data.values.github_private_key

- name: obix-repo
  type: git
  source:
    uri: #@ data.values.obix_git_uri
    branch: main
    private_key: #@ data.values.github_private_key

- name: edge-image
  type: registry-image
  source:
    tag: edge
    username: #@ data.values.gar_registry_user
    password: #@ data.values.gar_registry_password
    repository: #@ data.values.gar_registry + "/" + data.values.folder_registry_image

- name: sandbox-edge-image
  type: registry-image
  source:
    tag: edge
    username: #@ data.values.gar_registry_user
    password: #@ data.values.gar_registry_password
    repository: #@ data.values.gar_registry + "/sandbox"

- name: tf-drua-prod
  type: terraform
  source:
    backend_type: gcs
    backend_config:
      bucket: #@ data.values.deploy_tf_state_bucket
      prefix: drua/prod
      credentials: #@ data.values.deploy_gcp_creds_json
    env:
      GOOGLE_CREDENTIALS: #@ data.values.deploy_gcp_creds_json

- name: code-assistant-index
  type: gcs-resource
  source:
    bucket: #@ data.values.code_assistant_gcs_bucket
    json_key: #@ data.values.gcs_creds_json
    regexp: index/(.*).tar.gz

- name: code-assistant-model
  type: gcs-resource
  source:
    bucket: #@ data.values.code_assistant_gcs_bucket
    json_key: #@ data.values.gcs_creds_json
    regexp: model/(.*).tar.gz

- name: code-assistant-embedder
  type: gcs-resource
  source:
    bucket: #@ data.values.code_assistant_gcs_bucket
    json_key: #@ data.values.gcs_creds_json
    regexp: embedder/(.*).tar.gz

- name: nightly
  type: time
  source:
    start: "04:00"
    stop: "04:30"
    location: UTC
