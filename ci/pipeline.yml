#@ load("@ytt:data", "data")
#@ load("fragments.lib.yml",
#@   "nix_flake_cachix_image_config",
#@ )

groups:
- name: galoy-agents-bin
  jobs:
  - check-code
  - test-bats
  - build-edge-image
  - build-style-index

jobs:
- name: check-code
  serial: true
  plan:
  - get: repo
    trigger: true
  - task: nix-flake-check
    config:
      platform: linux
      image_resource: #@ nix_flake_cachix_image_config()
      inputs:
      - name: repo
      params:
        CACHIX_AUTH_TOKEN: #@ data.values.cachix_auth_token
        CACHIX_CACHE_NAME: #@ data.values.cachix_cache_name
      run:
        path: sh
        args:
          - -exc
          - |
            set -euo pipefail
            cd repo
            cachix use $CACHIX_CACHE_NAME
            cachix watch-exec $CACHIX_CACHE_NAME -- nix flake check

- name: test-bats
  serial: true
  plan:
  - get: repo
    trigger: true
  - task: bats-e2e
    privileged: true
    attempts: 2
    config:
      platform: linux
      image_resource: #@ nix_flake_cachix_image_config()
      inputs:
      - name: repo
      params:
        CACHIX_AUTH_TOKEN: #@ data.values.cachix_auth_token
        CACHIX_CACHE_NAME: #@ data.values.cachix_cache_name
      run:
        path: sh
        args:
          - -exc
          - |
            set -euo pipefail
            cd repo
            cachix use $CACHIX_CACHE_NAME
            cachix watch-exec $CACHIX_CACHE_NAME -- nix run .#bats

- name: build-edge-image
  serial: true
  plan:
  - get: repo
    trigger: true
    passed: [check-code, test-bats]
  - task: build-image
    config:
      platform: linux
      image_resource: #@ nix_flake_cachix_image_config()
      inputs:
      - name: repo
      outputs:
      - name: image
      params:
        CACHIX_AUTH_TOKEN: #@ data.values.cachix_auth_token
        CACHIX_CACHE_NAME: #@ data.values.cachix_cache_name
      run:
        path: sh
        args:
          - -exc
          - |
            set -euo pipefail
            cd repo
            cachix use $CACHIX_CACHE_NAME
            cachix watch-exec $CACHIX_CACHE_NAME -- nix build .#docker-image
            gunzip -c result > ../image/image.tar
  - put: edge-image
    params:
      image: image/image.tar

- name: build-style-index
  serial: true
  plan:
  - in_parallel:
    - get: repo
      trigger: true
    - get: cala-repo
      trigger: true
    - get: lana-repo
      trigger: true
    - get: job-repo
      trigger: true
    - get: obix-repo
      trigger: true
  - task: build-and-upload-index
    tags: [galoy-agents]
    config:
      platform: linux
      image_resource: #@ nix_flake_cachix_image_config()
      inputs:
      - name: repo
      - name: cala-repo
      - name: lana-repo
      - name: job-repo
      - name: obix-repo
      outputs:
      - name: index
      params:
        CACHIX_AUTH_TOKEN: #@ data.values.cachix_auth_token
        CACHIX_CACHE_NAME: #@ data.values.cachix_cache_name
        GCS_CREDS_JSON: #@ data.values.gcs_creds_json
        GCS_BUCKET: #@ data.values.style_agent_gcs_bucket
      run:
        path: sh
        args:
          - -exc
          - |
            set -euo pipefail
            cachix use $CACHIX_CACHE_NAME

            mkdir -p /tmp/repos
            ln -s "$(pwd)/cala-repo" /tmp/repos/cala
            ln -s "$(pwd)/lana-repo" /tmp/repos/lana-bank
            ln -s "$(pwd)/job-repo" /tmp/repos/job
            ln -s "$(pwd)/obix-repo" /tmp/repos/obix
            ln -s "$(pwd)/repo" /tmp/repos/galoy-agents

            set +x
            echo "$GCS_CREDS_JSON" > /tmp/gcs-key.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcs-key.json
            set -x

            cd repo
            cachix watch-exec $CACHIX_CACHE_NAME -- nix run ./ci#build-style-index -- /tmp/repos "$GCS_BUCKET"

resources:
- name: repo
  type: git
  source:
    ignore_paths: ["ci/*[^md]"]
    fetch_tags: true
    uri: #@ data.values.git_uri
    branch: #@ data.values.git_branch
    private_key: #@ data.values.github_private_key
  webhook_token: ((webhook.secret))

- name: cala-repo
  type: git
  source:
    uri: #@ data.values.cala_git_uri
    branch: main
    private_key: #@ data.values.github_private_key

- name: lana-repo
  type: git
  source:
    uri: #@ data.values.lana_git_uri
    branch: main
    private_key: #@ data.values.github_private_key

- name: job-repo
  type: git
  source:
    uri: #@ data.values.job_git_uri
    branch: main
    private_key: #@ data.values.github_private_key

- name: obix-repo
  type: git
  source:
    uri: #@ data.values.obix_git_uri
    branch: main
    private_key: #@ data.values.github_private_key

- name: edge-image
  type: registry-image
  source:
    tag: edge
    username: #@ data.values.gar_registry_user
    password: #@ data.values.gar_registry_password
    repository: #@ data.values.gar_registry + "/" + data.values.folder_registry_image
