type Agent {
	"""
	The sandbox this agent is attached to, if any.
	"""
	attachedSandbox: SandboxAttachment
	id: AgentId!
	name: String!
	role: AgentRole!
	"""
	The agent's conversation session.
	"""
	session: AgentSession!
	workspaceId: WorkspaceId!
}

scalar AgentId

enum AgentRole {
	AGENT
	WORKSPACE_LEAD
}

type AgentSession {
	"""
	Flat chat history: recent user messages and assistant responses.
	Returns the last `last` messages in chronological order.
	"""
	chatHistory(last: Int! = 20): [ChatMessage!]!
	"""
	All threads in this session.
	"""
	threads: [SessionThread!]!
}

union ChatContentBlock = TextContent | ToolUseContent | ThinkingContent | ToolResultContent | SandboxNotificationContent

type ChatMessage {
	content: [ChatContentBlock!]!
	role: ChatMessageRole!
	"""
	Ordinal position in the full message history (0-based).
	"""
	sequence: Int!
}

enum ChatMessageRole {
	ASSISTANT
	USER
}

type Me {
	email: String
	githubUsername: String
	id: UUID!
	name: String
}

type Mutation {
	"""
	Placeholder — will be replaced with real mutations.
	"""
	ping: String!
	workspaceCreate(input: WorkspaceCreateInput!): WorkspaceCreatePayload!
	workspaceDelete(input: WorkspaceDeleteInput!): WorkspaceDeletePayload!
	workspaceUpdate(input: WorkspaceUpdateInput!): WorkspaceUpdatePayload!
}

"""
Information about pagination in a connection
"""
type PageInfo {
	"""
	When paginating forwards, the cursor to continue.
	"""
	endCursor: String
	"""
	When paginating forwards, are there more items?
	"""
	hasNextPage: Boolean!
	"""
	When paginating backwards, are there more items?
	"""
	hasPreviousPage: Boolean!
	"""
	When paginating backwards, the cursor to continue.
	"""
	startCursor: String
}

type Query {
	"""
	Look up a single agent by ID.
	"""
	agent(id: AgentId!): Agent
	"""
	The currently authenticated user, if any.
	"""
	me: Me
	ping: String!
	workspace(id: WorkspaceId!): Workspace
	workspaces(after: String, first: Int!): WorkspaceConnection!
}

type SandboxAttachment {
	mode: SandboxAttachmentMode!
	name: String!
	sandboxId: SandboxId!
}

enum SandboxAttachmentMode {
	READ
	WRITE
}

scalar SandboxId

type SandboxNotificationContent {
	operation: SandboxNotificationOperation!
	sandboxName: String!
}

enum SandboxNotificationOperation {
	ATTACH
	DETACH
}

type SessionThread {
	id: SessionThreadId!
	"""
	Whether this is the currently active thread.
	"""
	isCurrent: Boolean!
	"""
	Resolved messages for this thread (as the LLM sees them).
	Each entry carries its own block indexes for shared-node detection.
	"""
	messages: [ThreadMessageEntry!]!
	"""
	Whose turn it is next on this thread.
	"""
	nextTurn: ThreadTurn!
	"""
	Why this thread was created.
	"""
	startReason: ThreadStartReason!
}

scalar SessionThreadId

type TextContent {
	text: String!
}

type ThinkingContent {
	text: String!
}

type ThreadMessageEntry {
	"""
	Global block indexes referenced by this message turn.
	Compare across threads to identify shared content nodes.
	"""
	blockIndexes: [Int!]!
	content: [ChatContentBlock!]!
	role: ChatMessageRole!
}

enum ThreadStartReason {
	COMPACTION
	INITIAL_THREAD
	TOOL_DEFS_UPDATED
}

enum ThreadTurn {
	ASSISTANT
	TOOL_USE
	USER
}

"""
An ISO 8601 UTC timestamp (e.g., 2024-01-15T09:30:00Z). Always in UTC.
"""
scalar Timestamp

type ToolResultContent {
	content: String!
	isError: Boolean!
	toolUseId: String!
}

type ToolUseContent {
	name: String!
}

scalar UUID

type Workspace {
	"""
	All agents in this workspace (lead agent first).
	"""
	agents: [Agent!]!
	createdAt: Timestamp!
	description: String
	id: WorkspaceId!
	"""
	The workspace lead agent.
	"""
	lead: Agent!
	name: String!
}

type WorkspaceConnection {
	"""
	A list of edges.
	"""
	edges: [WorkspaceEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Workspace!]!
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
}

input WorkspaceCreateInput {
	description: String
	name: String!
}

type WorkspaceCreatePayload {
	workspace: Workspace!
}

input WorkspaceDeleteInput {
	id: WorkspaceId!
}

type WorkspaceDeletePayload {
	workspace: Workspace!
}

"""
An edge in a connection.
"""
type WorkspaceEdge {
	"""
	A cursor for use in pagination
	"""
	cursor: String!
	"""
	The item at the end of the edge
	"""
	node: Workspace!
}

scalar WorkspaceId

input WorkspaceUpdateInput {
	description: String
	id: WorkspaceId!
	name: String!
}

type WorkspaceUpdatePayload {
	workspace: Workspace!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: Query
	mutation: Mutation
}
