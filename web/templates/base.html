<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Galoy Agents{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    body { display: flex; min-height: 100vh; margin: 0; }
    .sidebar {
      width: 220px;
      background: var(--pico-card-background-color);
      border-right: 1px solid var(--pico-muted-border-color);
      padding: 1.5rem 1rem;
      flex-shrink: 0;
    }
    .sidebar h4 { margin-bottom: 1.5rem; }
    .sidebar nav ul { list-style: none; padding: 0; margin: 0 0 1rem 0; }
    .sidebar nav ul li { margin-bottom: 0.25rem; }
    .sidebar .section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--pico-muted-color);
      padding: 0.5rem 0.75rem 0.25rem;
      margin-top: 0.5rem;
    }
    .sidebar nav ul li a {
      display: block;
      padding: 0.5rem 0.75rem;
      border-radius: var(--pico-border-radius);
      text-decoration: none;
      color: var(--pico-color);
    }
    .sidebar nav ul li a:hover,
    .sidebar nav ul li a.active {
      background: var(--pico-primary-background);
      color: var(--pico-primary-inverse);
    }
    .sidebar .sidebar-bottom {
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid var(--pico-muted-border-color);
    }
    .content-area {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
    }
    .token-box {
      position: relative;
      background: var(--pico-code-background-color);
      border: 2px solid var(--pico-primary-background);
      border-radius: var(--pico-border-radius);
      padding: 1rem;
      margin: 1rem 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .token-box code {
      flex: 1;
      word-break: break-all;
      background: none;
      padding: 0;
    }
    .token-box button {
      width: auto;
      margin: 0;
      padding: 0.25rem 0.75rem;
      white-space: nowrap;
    }
    .token-warning {
      color: var(--pico-del-color);
      font-weight: bold;
    }
    .badge-active {
      color: var(--pico-ins-color);
    }
    .badge-revoked {
      color: var(--pico-del-color);
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <aside class="sidebar">
    <h4>Galoy Agents</h4>
    <nav>
      <ul>
        <li><a href="/workspaces" {% block nav_workspaces %}{% endblock %}>Workspaces</a></li>
        <li><a href="/dashboard" {% block nav_dashboard %}{% endblock %}>MCP Credentials</a></li>
        <li><a href="/code-assistant" {% block nav_code_assistant %}{% endblock %}>Code Assistant</a></li>
        <li><a href="/reports" {% block nav_reports %}{% endblock %}>Reports</a></li>
      </ul>
      <div class="section-label">Administration</div>
      <ul>
        <li><a href="/audit" {% block nav_audit %}{% endblock %}>Audit Log</a></li>
      </ul>
    </nav>
    <div class="sidebar-bottom">
      <a href="/auth/logout">Logout</a>
    </div>
  </aside>
  <div class="content-area">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
