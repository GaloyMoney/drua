<article aria-label="MCP credentials created">
  <header>
    <h3>MCP Credentials Created: {{ creds_name }}</h3>
  </header>
  <p class="token-warning">This configuration will not be shown again. Copy it now.</p>

  <p><strong>Claude Code CLI:</strong></p>
  <div class="token-box">
    <pre id="cli-cmd"><code>{{ cli_command }}</code></pre>
    <button
      onclick="navigator.clipboard.writeText(document.getElementById('cli-cmd').textContent).then(function(){this.textContent='Copied!'}.bind(this))"
      class="outline"
    >
      Copy
    </button>
  </div>

  <p><strong>MCP JSON config:</strong></p>
  <div class="token-box">
    <pre id="mcp-config"><code>{{ mcp_json }}</code></pre>
    <button
      onclick="navigator.clipboard.writeText(document.getElementById('mcp-config').textContent).then(function(){this.textContent='Copied!'}.bind(this))"
      class="outline"
    >
      Copy
    </button>
  </div>
</article>

<script>
  document.querySelector('#creds-list')
    && htmx.ajax('GET', '/dashboard/mcp-creds', {target: '#creds-list', swap: 'innerHTML'});
</script>
