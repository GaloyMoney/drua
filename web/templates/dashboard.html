{% extends "base.html" %}

{% block title %}Dashboard — Galoy Agents{% endblock %}

{% block content %}
<nav>
  <ul><li><strong>Galoy Agents</strong></li></ul>
  <ul>
    <li>{{ user_name }}</li>
    <li><a href="/auth/logout">Logout</a></li>
  </ul>
</nav>

<section>
  <h2>Create Agent</h2>
  <form hx-post="/agents/create" hx-target="#agent-result" hx-swap="innerHTML">
    <label>
      Name
      <input type="text" name="name" required placeholder="my-agent">
    </label>
    <button type="submit">Create Agent</button>
  </form>
  <div id="agent-result"></div>
</section>

<section>
  <h2>Your Agents</h2>
  <figure>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Created</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="agent-list">
        {% for agent in agents %}
        {% include "agent_row.html" %}
        {% endfor %}
      </tbody>
    </table>
  </figure>
</section>
{% endblock %}
