<figure>
  <table>
    <thead>
      <tr>
        <th>Subject</th>
        <th>Type</th>
        <th>Action</th>
        <th>Outcome</th>
        <th>Duration</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody>
      {% for entry in entries %}
      <tr>
        <td class="query-text">{{ entry.display_subject }}</td>
        <td>{{ entry.interaction_type }}</td>
        <td>{{ entry.action }}</td>
        <td><span class="outcome-{{ entry.outcome }}">{{ entry.outcome }}</span></td>
        <td>{% match entry.duration_ms %}{% when Some with (ms) %}{{ ms }}ms{% when None %}—{% endmatch %}</td>
        <td>{{ entry.recorded_at.format("%Y-%m-%d %H:%M:%S UTC") }}</td>
      </tr>
      {% if entry.metadata != serde_json::Value::Object(Default::default()) %}
      <tr>
        <td colspan="6" style="padding: 0;">
          <details>
            <summary style="padding: 0.25rem 0.5rem; font-size: 0.8rem; cursor: pointer;">Show metadata</summary>
            <pre style="font-size: 0.75rem; max-height: 300px; overflow: auto; margin: 0; padding: 0.5rem;">{{ entry.metadata }}</pre>
          </details>
        </td>
      </tr>
      {% endif %}
      {% endfor %}
      {% if entries.is_empty() %}
      <tr><td colspan="6">No audit entries found.</td></tr>
      {% endif %}
    </tbody>
  </table>
</figure>
