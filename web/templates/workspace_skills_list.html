{% if skills.is_empty() %}
<p><em>No skills configured.</em></p>
{% else %}
<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Description</th>
      <th>Created</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for skill in skills %}
    <tr>
      <td><strong>{{ skill.name }}</strong></td>
      <td>{{ skill.description }}</td>
      <td><small>{{ skill.created_at }}</small></td>
      <td style="display: flex; gap: 0.5rem;">
        <a href="/workspaces/{{ skill.workspace_id }}/skills/{{ skill.id }}">Edit</a>
        <button
          hx-post="/workspaces/{{ skill.workspace_id }}/skills/{{ skill.id }}/delete"
          hx-target="#skills-list"
          hx-swap="innerHTML"
          hx-confirm="Delete skill '{{ skill.name }}'?"
          class="outline secondary"
          style="padding: 0.25rem 0.5rem; margin: 0;"
        >Delete</button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endif %}
