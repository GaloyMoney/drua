[package]
name = "galoy-agents-web"
version.workspace = true
edition.workspace = true

[lib]

[dependencies]
galoy-agents-core = { path = "../core" }
anyhow = "1"
k8s-openapi = { version = "0.25", features = ["v1_33"] }
kube = { version = "1", features = ["client"] }
askama = "0.15"
askama_web = { version = "0.15", features = ["axum-0.8"] }
async-trait = "0.1"
axum = "0.8"
chrono = "0.4"
axum-extra = { version = "0.10", features = ["cookie"] }
oauth2 = { version = "5.0", features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
thiserror = "2.0"
time = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
tower-service = "0.3"
tokio = { version = "1", features = ["net"] }
tokio-stream = "0.1"
tower-sessions = "0.15"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
