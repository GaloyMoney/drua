[package]
name = "galoy-agents-web"
version.workspace = true
edition.workspace = true

[lib]

[[bin]]
name = "write_sdl"
path = "src/bin/write_sdl.rs"

[dependencies]
galoy-agents-core = { path = "../core", features = ["graphql"] }
es-entity = { workspace = true }
anyhow = "1"
k8s-openapi = { version = "0.25", features = ["v1_33"] }
kube = { version = "1", features = ["client"] }
askama = "0.15"
askama_web = { version = "0.15", features = ["axum-0.8"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
chrono = "0.4"
axum-extra = { version = "0.10", features = ["cookie"] }
oauth2 = { version = "5.0", features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
thiserror = "2.0"
time = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
tower-service = "0.3"
tokio = { version = "1", features = ["net"] }
tokio-stream = "0.1"
tower-sessions = "0.15"
opentelemetry = "0.31"
opentelemetry-http = "0.31"
async-graphql = { version = "8.0.0-rc.4", default-features = false, features = ["tracing", "tempfile"] }
async-graphql-axum = "8.0.0-rc.4"
tracing = "0.1"
tracing-opentelemetry = "0.32"
url = { workspace = true }
uuid = { version = "1", features = ["v4"] }
