name: "setup-nix"

description: "Install Nix and configure Cachix."

inputs:
  cachix_auth_token:
    description: "Cachix authentication token."
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - uses: DeterminateSystems/nix-installer-action@v16
    # Cache may be deleted or the token revoked; skip cachix instead of failing
    - name: Probe cachix cache
      id: cachix
      shell: bash
      if: inputs.cachix_auth_token != ''
      env:
        CACHIX_AUTH_TOKEN: ${{ inputs.cachix_auth_token }}
      run: |
        if curl -sf -H "Authorization: Bearer $CACHIX_AUTH_TOKEN" https://drua-github-actions.cachix.org/nix-cache-info > /dev/null; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi
    - uses: cachix/cachix-action@v17
      if: steps.cachix.outputs.available == 'true'
      with:
        name: drua-github-actions
        authToken: ${{ inputs.cachix_auth_token }}
        skipPush: false
