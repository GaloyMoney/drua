name: Bats E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: COMPOSE_CMD="docker compose" nix run .#bats
