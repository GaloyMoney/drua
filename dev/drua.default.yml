server:
  port: 4200
  host: 0.0.0.0
  secure_cookies: true
  mcp_endpoint: http://localhost:4200/mcp
  tunnel:
    deployments: {}
    heartbeat_secs: 30
    expires_after_secs: 90
    reaper_interval_secs: 60
oauth:
  login: github
  github_redirect_uri: ''
  github_client_id: ''
  github_allowed_teams: []
  dev_mode_agent_tokens: false
db:
  max_connections: 30
providers: []
agents:
  builtin_roles: {}
  models: {}
toolsets:
  mcp_upstreams: []
  tunnel_log_tools: {}
  concourse:
    enabled: false
    url: ''
    team: ''
  zenduty:
    enabled: false
    url: ''
    default_team: ''
  code_assistant:
    db_path: ''
  compose:
    max_tool_calls: 50
    max_tool_result_bytes: 33554432
    max_return_bytes: 16777216
    max_console_bytes: 8192
    memory_limit_bytes: 67108864
    stack_limit_bytes: 524288
    timeout_ms: 420000
sandbox:
  backend:
    provider: local
    sandbox_spawn_cmd: cargo run -q -p sandbox-tool-server --
    local_repo_root: .
github_app: null
library:
  data_dir: null
  repo_url: null
  skill_sync_interval_secs: 20
git_proxy:
  allowlist:
    entries: []
  mirror_root: null
  mirror_ttl_seconds: 0
tool_caching:
  generic_threshold_bytes: 8192
  sentinel_min_bytes: 512
  sentinel_hard_cap_bytes: 16384
  max_fetch_response_bytes: 16384
  min_hidden_bytes: 6144
  document_min_hidden_bytes: 65536
  min_hidden_per_path_bytes: 2048
  per_tool: {}

